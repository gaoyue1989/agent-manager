# 前端 Deployment + NodePort 30881
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-frontend
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: platform-frontend }
  template:
    metadata:
      labels: { app: platform-frontend }
    spec:
      containers:
        - name: frontend
          image: 172.20.0.1:5001/platform-frontend:v7
          # IfNotPresent（与 platform-backend 及流水线裸 tag 部署语义对齐）：Always 会让
          # containerd 对裸 tag（无 registry 前缀）强制回源 docker.io 解析，kind 离线环境
          # 必然 i/o timeout → ImagePullBackOff（2026-11-08 第 1 轮部署实锤）；本地 registry
          # tag 漂移场景由部署后 rollout restart 强制换代兜底（b09cc73 同款语义）
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            # 同源反代目标(src/proxy.ts 请求期读取),按部署环境修改即可,无需重建镜像
            - { name: BACKEND_INTERNAL_URL, value: "http://platform-backend.agent-platform.svc.cluster.local:8080" }
            - { name: AGENT_INTERNAL_URL, value: "http://oaf-release-agent-svc.agent-platform.svc.cluster.local:8100" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits:   { memory: 512Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: platform-frontend-nodeport
  namespace: agent-platform
spec:
  type: NodePort
  selector: { app: platform-frontend }
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30881
