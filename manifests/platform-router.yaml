# platform-router：router 模式（INGRESS_HOST_SUFFIX 空）的集群内子路径路由器
#（subpath-routing-design §4.2/§4.3）。一次性自举（kubectl apply），backend 发布链路
# 零写入——nginx 配置静态泛化（正则从 URL 提取服务名 + kube-dns 动态解析 upstream），
# 新服务只要 {name}-svc 存在，DNS 生效后路由自动可用，无 ConfigMap 热更、无 reload。
#
# 固化进 nginx.conf 的平台约定（与 backend 命名规则同级的不变量，改动须两侧同步）：
#   oaf- 前缀、-svc 后缀、业务端口 8100、namespace agent-platform。
# kind 环境需先导入镜像：docker pull nginx:1.27.1-alpine && kind load docker-image ...
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-router-conf
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: platform-router
    app.kubernetes.io/managed-by: oaf-platform
data:
  # 以 nginx 官方镜像 templates+envsubst 机制渲染（/etc/nginx/templates/*.template →
  # /etc/nginx/conf.d/*.conf，仅替换环境中已定义的变量，$host/$short 等 nginx 变量不受影响）。
  # ROUTER_AUTH_MODE 由 Deployment env 注入（off|report|enforce），改档 = 改 ConfigMap/env + 滚动重启。
  default.conf.template: |
    # 数据面网关鉴权（console-user-workspace-split M9 §3；issue #373 修订 off 语义）：
    #   off     免鉴权但不免身份：/_auth introspect 尽力解析（Authorization / 登录 cookie），
    #           解析失败或 backend 不可用时放行并回落客户端自报 X-User-Id（fail-open，业务面恒达）
    #   report  同 off 的身份尽力解析，坏凭据 401/403 放行（灰度观察）；backend 5xx 拒绝（fail-closed）
    #   enforce 无凭据/无效凭据 401、吊销即时 403、backend 5xx 拒绝（全 fail-closed）
    # auth 子请求是短平快元数据调用，业务流量本体不经 backend（原则一不变量）；SSE 仅握手时一次。
    # 分档拦截挂在 /_auth 子请求内（include 分档片段：proxy_intercept_errors + error_page）——
    # 数据面 location 挂 error_page 实测把 401 拒绝变成「200 空响应」且业务 upstream 未被调用，
    # 不可用（行为矩阵见 e2e/scripts/router-auth-modes-verify.sh）。
    # 身份信任链：map 模式源必须用 envsubst 字面量 ${ROUTER_AUTH_MODE}（渲染后为常量；请求变量
    # 做模式源实测被子请求求值污染）——off 无鉴权结果回落自报、off 有结果 / report+enforce
    # 一律以 introspect 结果覆盖客户端自报（M9 §4）。
    map "${ROUTER_AUTH_MODE}:${auth_result_uid}" $auth_uid {
      ~^off:$    $http_x_user_id;  # off 无鉴权结果（无凭据/解析失败）：回落客户端自报（历史行为）
      default    $auth_result_uid; # off 有结果 / report+enforce：以鉴权结果为准（不信任自报）
    }
    map $http_x_forwarded_proto $fwd_proto_fwd { default $http_x_forwarded_proto; "" $scheme; }
    map $http_x_forwarded_host  $fwd_host      { default $http_x_forwarded_host;  "" $http_host; }

    log_format auth '$remote_addr "$request" status=$status auth=$auth_code uid=$auth_result_uid';
    access_log /dev/stdout auth;

    server {
      listen 8080;
      # 动态 upstream（$short）必须显式 resolver；默认 kube-dns ClusterIP，
      # 非默认 Service CIDR 的集群用 DNS_RESOLVER 覆盖（kind 默认 10.96.0.10）。
      resolver ${DNS_RESOLVER} valid=10s ipv6=off;
      # 与文件上传（POST /files/upload）对齐：入口层不设更严于历史的体量限制，
      # 上限由应用层裁决
      client_max_body_size 200m;

      # auth_request 内部子请求：三档共用的纯 introspect（backend JWT / API Key / 会话 cookie
      # 三通道），分档拦截语义经 include 切换（见 auth-*.conf 片段）。X-User-Id 响应头经
      # auth_request_set 回注；X-Original-URI 供 API Key 作用域裁决（绑定单 Agent 的 key 仅
      # 放行该 Agent 路由）。Cookie 显式透传：浏览器只有 httpOnly 登录 cookie、无自报头，
      # introspect 读 cookie 注入身份（issue #373；nginx 默认即透传客户端头，声明防误读）。
      location = /_auth {
        internal;
        include /etc/nginx/auth-mode/auth-${ROUTER_AUTH_MODE}.conf;
        proxy_pass http://oaf-platform-backend.agent-platform.svc.cluster.local:8080/api/v1/auth/introspect;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
      }
      # 放行 named location 无条件定义（未被引用的档无害）：off=拦截 introspect 全部失败码
      # 后恒放行；report=坏凭据 401/403 放行
      location @off_allow { internal; return 200; }
      location @report_allow { internal; return 200; }

      # 内部路径排除（安全不变量，与 host 模式 per-service Ingress 排除表同语义，
      # 见 docs/deployment.md §七之二）：/agent/{short}/internal、/agent/{short}/actuator
      # 段边界匹配恒 404（/internalx 等业务路径不受影响）。skills-syncd 内部端点与
      # actuator 的合法消费仅集群内 svc 直连（守护 SKILLSYNC_BASE_URL 指向 svc，
      # 不经 router），token 门为主控制——此排除使两种模式外部表现一致（纵深防御）。
      # 正则 location 按声明顺序首匹配生效，必须置于下方泛化 location 之前
      location ~ ^/agent/[a-z0-9-]+/(internal|actuator)(/|$) {
        return 404;
      }

      # [a-z0-9-] 限定字符集：$short 只出现在域名 label 位置，杜绝路径注入 upstream；
      # nginx 在 location 匹配前已做 URI 归一化（合并斜杠、消解 ../）
      location ~ ^/agent/(?<short>[a-z0-9-]+) {
        auth_request /_auth;
        auth_request_set $auth_result_uid $upstream_http_x_user_id;
        auth_request_set $auth_code $upstream_status;

        rewrite ^/agent/[a-z0-9-]+/?(.*)$ /$1 break;    # 剥前缀：nginx 原生能力，替代 ingress 注解
        proxy_pass http://oaf-$short-svc.agent-platform.svc.cluster.local:8100;
        proxy_set_header X-User-Id       $auth_uid;      # off 无结果=自报兜底 / off 有结果+report+enforce=鉴权结果覆盖
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto_fwd;
        proxy_set_header X-Forwarded-Host  $fwd_host;
        proxy_set_header X-Forwarded-Prefix /agent/$short;   # agent-framework 前缀感知的输入契约
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";         # SSE 长连接
        proxy_buffering off;                    # SSE 不缓冲
        proxy_request_buffering off;            # 上传直透
        proxy_read_timeout 3600s;               # 等价原 ingress path 模式注解三件套
        proxy_send_timeout 3600s;
      }

      location = /healthz { access_log off; return 200 "ok"; }   # router 自身存活探针
      location / { return 404; }
    }

  # 分档拦截片段（/_auth 内 include /etc/nginx/auth-mode/auth-${ROUTER_AUTH_MODE}.conf，
  # envsubst 渲染期三选一；非法档位 → include 文件缺失 → 配置装载失败 crashloop，fail-fast）。
  # 拦截必须挂子请求内：proxy_intercept_errors 拦 introspect 上游响应码 + error_page 转 named
  # location 内部重定向，子请求 200 → auth_request 放行主请求恒达业务面。
  auth-off.conf: |
    # off：免鉴权但不免身份——introspect 无凭据/坏凭据/不可用（401/403/5xx）全部拦截放行
    proxy_intercept_errors on;
    error_page 401 403 500 502 503 504 =200 @off_allow;
  auth-report.conf: |
    # report：坏凭据真放行（灰度观察）；backend 5xx 不拦截 → 主请求 500（fail-closed）
    proxy_intercept_errors on;
    error_page 401 403 =200 @report_allow;
  auth-enforce.conf: |
    # enforce：fail-closed——无任何拦截，401/403/5xx 原样拒绝主请求

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-router
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: platform-router
    app.kubernetes.io/managed-by: oaf-platform
spec:
  replicas: 2                    # 业务流量共享组件：双副本控制故障域
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0          # 滚动时不丢新建连接（旧 pod 终止仍会断其上的 SSE 长流，运维窗口操作）
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-router
        app.kubernetes.io/managed-by: oaf-platform
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.1-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ROUTER_AUTH_MODE          # off=免鉴权但不免身份 | report | enforce（灰度三态，见模板头注释）
              value: "off"
            - name: DNS_RESOLVER              # 动态 upstream 解析（kube-dns ClusterIP）
              value: "10.96.0.10"
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/templates   # nginx 官方 entrypoint envsubst 渲染到 conf.d/
              readOnly: true
            - name: auth-mode
              mountPath: /etc/nginx/auth-mode   # 三档拦截片段（/_auth include 渲染期三选一）
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: conf
          configMap:
            name: platform-router-conf
            items:
              - key: default.conf.template
                path: default.conf.template
        - name: auth-mode
          configMap:
            name: platform-router-conf
            items:
              - key: auth-off.conf
                path: auth-off.conf
              - key: auth-report.conf
                path: auth-report.conf
              - key: auth-enforce.conf
                path: auth-enforce.conf
---
apiVersion: v1
kind: Service
metadata:
  name: platform-router-svc     # backend router 模式启动自检对象（k8s.RequireRouter）
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: platform-router
    app.kubernetes.io/managed-by: oaf-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-router
  ports:
    - port: 80
      targetPort: 8080
---
# 共享业务入口 Ingress：零 rewrite 注解（path=/agent + Prefix 属 Ingress 核心规范，
# 任意 controller 可用）。机会性保留 timeout/ssl-redirect 注解：ingress-nginx 集群
# 生效，其他 controller 忽略后由 20s SSE 心跳兜底（subpath-routing §6.4）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-agent-router
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: platform-router
    app.kubernetes.io/managed-by: oaf-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx       # 按集群实际 controller 调整
  rules:
    - http:
        paths:
          - path: /agent
            pathType: Prefix
            backend:
              service:
                name: platform-router-svc
                port:
                  number: 80
