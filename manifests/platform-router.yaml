# platform-router：router 模式（INGRESS_HOST_SUFFIX 空）的集群内子路径路由器
#（subpath-routing-design §4.2/§4.3）。一次性自举（kubectl apply），backend 发布链路
# 零写入——nginx 配置静态泛化（正则从 URL 提取服务名 + kube-dns 动态解析 upstream），
# 新服务只要 {name}-svc 存在，DNS 生效后路由自动可用，无 ConfigMap 热更、无 reload。
#
# 固化进 nginx.conf 的平台约定（与 backend 命名规则同级的不变量，改动须两侧同步）：
#   oaf- 前缀、-svc 后缀、业务端口 8100、namespace agent-platform。
# kind 环境需先导入镜像：docker pull nginx:1.27.1-alpine && kind load docker-image ...
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-router-conf
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: platform-router
    app.kubernetes.io/managed-by: oaf-platform
data:
  # 以 nginx 官方镜像 templates+envsubst 机制渲染（/etc/nginx/templates/*.template →
  # /etc/nginx/conf.d/*.conf，仅替换环境中已定义的变量，$host/$short 等 nginx 变量不受影响）。
  # ROUTER_AUTH_MODE 由 Deployment env 注入（off|report|enforce），改档 = 改 ConfigMap/env + 滚动重启。
  default.conf.template: |
    # 数据面网关鉴权（console-user-workspace-split M9 §3）：
    #   off     不鉴权：/_auth 直接 200，X-User-Id 透传客户端自报（历史行为，默认）
    #   report  introspect 结果只记日志放行（灰度观察未鉴权流量比例，≥48h 后转 enforce）
    #   enforce 无凭据/无效凭据 401、吊销即时 403；作用域不匹配 403（fail-closed）
    # auth 子请求是短平快元数据调用，业务流量本体不经 backend（原则一不变量）；
    # SSE 仅握手时一次。身份信任链：report/enforce 以 introspect 结果覆盖客户端自报身份（M9 §4）。
    map "${ROUTER_AUTH_MODE}" $router_auth_mode {
      default "off";
      "report"  "report";
      "enforce" "enforce";
    }
    map $router_auth_mode $auth_uid {
      default $http_x_user_id;   # off：透传客户端自报（frontend proxy 注入或直连自报，历史行为）
      "report"  $auth_result_uid; # report/enforce：以鉴权结果为准（不信任客户端自报）
      "enforce" $auth_result_uid;
    }
    map $http_x_forwarded_proto $fwd_proto_fwd { default $http_x_forwarded_proto; "" $scheme; }
    map $http_x_forwarded_host  $fwd_host      { default $http_x_forwarded_host;  "" $http_host; }

    log_format auth '$remote_addr "$request" status=$status auth=$auth_code uid=$auth_result_uid';
    access_log /dev/stdout auth;

    server {
      listen 8080;
      # 与文件上传（POST /files/upload）对齐：入口层不设更严于历史的体量限制，
      # 上限由应用层裁决
      client_max_body_size 200m;

      # auth_request 内部子请求：backend introspect（JWT 或 API Key 双通道）。
      # X-User-Id 响应头经 auth_request_set 回注；X-Original-URI 供 API Key 作用域裁决
      #（绑定单 Agent 的 key 仅放行该 Agent 路由）。5s 超时 fail-closed（仅 enforce 生效路径）。
      location = /_auth {
        internal;
        if ($router_auth_mode = "off") {
          return 200;
        }
        if ($router_auth_mode = "report") {
          # 灰度观察：非 2xx 转 200 放行，仅 access_log 记 auth=$auth_code 供统计
          error_page 401 403 =200 @report_allow;
        }
        proxy_pass http://oaf-platform-backend.agent-platform.svc.cluster.local:8080/api/v1/auth/introspect;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
      }
      location @report_allow { internal; return 200; }

      # [a-z0-9-] 限定字符集：$short 只出现在域名 label 位置，杜绝路径注入 upstream；
      # nginx 在 location 匹配前已做 URI 归一化（合并斜杠、消解 ../）
      location ~ ^/agent/(?<short>[a-z0-9-]+) {
        auth_request /_auth;
        auth_request_set $auth_result_uid $upstream_http_x_user_id;
        auth_request_set $auth_code $upstream_status;

        rewrite ^/agent/[a-z0-9-]+/?(.*)$ /$1 break;    # 剥前缀：nginx 原生能力，替代 ingress 注解
        proxy_pass http://oaf-$short-svc.agent-platform.svc.cluster.local:8100;
        proxy_set_header X-User-Id       $auth_uid;      # off=透传自报 / report+enforce=鉴权结果覆盖
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto_fwd;
        proxy_set_header X-Forwarded-Host  $fwd_host;
        proxy_set_header X-Forwarded-Prefix /agent/$short;   # agent-framework 前缀感知的输入契约
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";         # SSE 长连接
        proxy_buffering off;                    # SSE 不缓冲
        proxy_request_buffering off;            # 上传直透
        proxy_read_timeout 3600s;               # 等价原 ingress path 模式注解三件套
        proxy_send_timeout 3600s;
      }

      location = /healthz { access_log off; return 200 "ok"; }   # router 自身存活探针
      location / { return 404; }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-router
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: platform-router
    app.kubernetes.io/managed-by: oaf-platform
spec:
  replicas: 2                    # 业务流量共享组件：双副本控制故障域
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0          # 滚动时不丢新建连接（旧 pod 终止仍会断其上的 SSE 长流，运维窗口操作）
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-router
        app.kubernetes.io/managed-by: oaf-platform
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.1-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ROUTER_AUTH_MODE          # off | report | enforce（灰度三态，见模板头注释）
              value: "off"
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/templates   # nginx 官方 entrypoint envsubst 渲染到 conf.d/
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: conf
          configMap:
            name: platform-router-conf
            items:
              - key: default.conf.template
                path: default.conf.template
---
apiVersion: v1
kind: Service
metadata:
  name: platform-router-svc     # backend router 模式启动自检对象（k8s.RequireRouter）
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: platform-router
    app.kubernetes.io/managed-by: oaf-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-router
  ports:
    - port: 80
      targetPort: 8080
---
# 共享业务入口 Ingress：零 rewrite 注解（path=/agent + Prefix 属 Ingress 核心规范，
# 任意 controller 可用）。机会性保留 timeout/ssl-redirect 注解：ingress-nginx 集群
# 生效，其他 controller 忽略后由 20s SSE 心跳兜底（subpath-routing §6.4）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-agent-router
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: platform-router
    app.kubernetes.io/managed-by: oaf-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx       # 按集群实际 controller 调整
  rules:
    - http:
        paths:
          - path: /agent
            pathType: Prefix
            backend:
              service:
                name: platform-router-svc
                port:
                  number: 80
