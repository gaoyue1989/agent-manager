# 业务镜像由 workflow 在 apply 前用 sed 替换 __AGENT_IMAGE__。
# INGRESS_HOST 指向 runner 的 localhost（kind extraPortMappings 30080）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: AVAILABLE_IMAGES
              value: "__AGENT_IMAGE__|E2E Agent"
            - name: DEFAULT_IMAGE
              value: "__AGENT_IMAGE__"
            - name: INGRESS_HOST
              value: "127.0.0.1"
            - name: INGRESS_PORT
              value: "30080"
