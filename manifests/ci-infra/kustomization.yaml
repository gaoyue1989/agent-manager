apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../ci

patches:
  - target:
      kind: Deployment
      name: platform-backend
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: platform-backend
  - target:
      kind: Deployment
      name: platform-frontend
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: platform-frontend
  - target:
      kind: Deployment
      name: mock-llm
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mock-llm
  - target:
      kind: Deployment
      name: mock-sandbox
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mock-sandbox
