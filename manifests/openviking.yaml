# OpenViking 上下文数据库（openviking-memory-integration-design-261116 §8）：
# 平台记忆/知识/技能的共享存储面（与 oaf-mysql / oaf-redis 同类的集群内基础设施）。
#
# 部署形态（PoC 261116 验证）：官方镜像单副本（AGPLv3 红线：只走官方镜像 + API/MCP
# 集成，禁止修改源码；one-shot upload token 倾向单 worker，扩多副本前须上游解决）。
# 数据落共享 PVC platform-data subPath（openviking/），随平台自举清单一起部署。
#
# 必须先手工就位的敏感配置（.env.secrets → Secret oaf-openviking-secret，见
# docs/deployment.md 运维备忘）：
#   OV_ROOT_API_KEY   root key（仅 backend 控制面持有：建/删 account、per-user key 签发）
#   OV_VLM_*          记忆提取 VLM（provider/api_key/model，OpenAI 兼容）
#   OV_EMBEDDING_*    embedding 模型（检索热路径；免费档/限速档不可用，PoC 实测）
#   OV_RERANK_*       rerank 模型（可选；未配置时检索退化为向量排序）
#
# 启用平台集成（backend env，platform.yaml）：
#   OPENVIKING_ENABLED=true
#   OPENVIKING_BASE_URL=http://openviking-svc.agent-platform.svc.cluster.local:1933
#   OPENVIKING_ROOT_API_KEY=<root key>
# backend 启动自检：ENABLED=true 但客户端构造失败（URL/key 空）按未启用处理并 warn，
# 发布链路零接触（config.Load 与 NewVikingAdmin 双重门控）。
---
apiVersion: v1
kind: Secret
metadata:
  name: oaf-openviking-secret
  namespace: agent-platform
type: Opaque
stringData:
  OV_ROOT_API_KEY: "CHANGE-ME-root-api-key"
  OV_VLM_PROVIDER: "openai"
  OV_VLM_API_BASE: "https://llm-provider.example/v1"
  OV_VLM_API_KEY: "CHANGE-ME-vlm-key"
  OV_VLM_MODEL: "vlm-model-name"
  OV_EMBEDDING_PROVIDER: "openai"
  OV_EMBEDDING_API_BASE: "https://embedding-provider.example/v1"
  OV_EMBEDDING_API_KEY: "CHANGE-ME-embedding-key"
  OV_EMBEDDING_MODEL: "embedding-model-name"
  OV_EMBEDDING_DIMENSION: "1024"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: agent-platform
  labels: { app: openviking }
spec:
  replicas: 1
  strategy: { type: Recreate }   # 单副本 + PVC RWO：滚动更新会双 Pod 抢卷，Recreate 保序
  selector: { matchLabels: { app: openviking } }
  template:
    metadata:
      labels: { app: openviking }
    spec:
      containers:
        - name: openviking
          # 官方镜像（ghcr.io 慢时用火山源：openviking-cn-beijing.cr.volces.com/volcengine/openviking）
          image: ghcr.io/volcengine/openviking:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 1933 }]
          env:
            - { name: OPENVIKING_PUBLIC_BASE_URL, value: "http://openviking-svc.agent-platform.svc.cluster.local:1933" }
            - { name: OV_ROOT_API_KEY, valueFrom: { secretKeyRef: { name: oaf-openviking-secret, key: OV_ROOT_API_KEY } } }
            - { name: OV_VLM_PROVIDER, valueFrom: { secretKeyRef: { name: oaf-openviking-secret, key: OV_VLM_PROVIDER } } }
            - { name: OV_VLM_API_BASE, valueFrom: { secretKeyRef: { name: oaf-openviking-secret, key: OV_VLM_API_BASE } } }
            - { name: OV_VLM_API_KEY, valueFrom: { secretKeyRef: { name: oaf-openviking-secret, key: OV_VLM_API_KEY } } }
            - { name: OV_VLM_MODEL, valueFrom: { secretKeyRef: { name: oaf-openviking-secret, key: OV_VLM_MODEL } } }
            - { name: OV_EMBEDDING_PROVIDER, valueFrom: { secretKeyRef: { name: oaf-openviking-secret, key: OV_EMBEDDING_PROVIDER } } }
            - { name: OV_EMBEDDING_API_BASE, valueFrom: { secretKeyRef: { name: oaf-openviking-secret, key: OV_EMBEDDING_API_BASE } } }
            - { name: OV_EMBEDDING_API_KEY, valueFrom: { secretKeyRef: { name: oaf-openviking-secret, key: OV_EMBEDDING_API_KEY } } }
            - { name: OV_EMBEDDING_MODEL, valueFrom: { secretKeyRef: { name: oaf-openviking-secret, key: OV_EMBEDDING_MODEL } } }
            - { name: OV_EMBEDDING_DIMENSION, valueFrom: { secretKeyRef: { name: oaf-openviking-secret, key: OV_EMBEDDING_DIMENSION } } }
          # ov.conf 由 entrypoint 从 OV_* env 生成（server.auth_mode=api_key、root_api_key、
          # vlm/embedding/rerank 三段模型配置）；环境专属差异（如国内镜像源、代理）在
          # 部署时经 env 覆盖，不落本清单。
          volumeMounts:
            - { name: data, mountPath: /app/.openviking }
          readinessProbe:
            httpGet: { path: /health, port: 1933 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { memory: 1Gi, cpu: 250m }
            limits:   { memory: 3Gi, cpu: "2" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: platform-data }
---
apiVersion: v1
kind: Service
metadata:
  name: openviking-svc
  namespace: agent-platform
  labels: { app: openviking }
spec:
  selector: { app: openviking }
  ports: [{ port: 1933, targetPort: 1933 }]
  # 集群内 only：不建 Ingress（网络边界即 trusted/api_key 的信任边界，设计 §4/§10）；
  # subPath 共享 PVC（platform-data 的 openviking/ 目录），与业务包/文件同卷隔离
