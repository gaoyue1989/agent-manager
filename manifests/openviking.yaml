# OpenViking 上下文数据库（openviking-memory-integration-design-261116 §8）：
# 平台记忆/知识/技能的共享存储面（与 oaf-mysql / oaf-redis 同类的集群内基础设施）。
#
# 部署形态（PoC 261116 验证）：官方镜像单副本（AGPLv3 红线：只走官方镜像 + API/MCP
# 集成，禁止修改源码；one-shot upload token 倾向单 worker，扩多副本前须上游解决）。
# 数据落共享 PVC platform-data subPath（openviking/），随平台自举清单一起部署。
#
# 必须先手工就位的敏感配置（Secret oaf-openviking-secret 的 OPENVIKING_CONF_CONTENT，
# 完整 ov.conf JSON——entrypoint 机制已核实；root_api_key 须与 backend 的
# OPENVIKING_ROOT_API_KEY 同值）：
#   server.root_api_key  root key（仅 backend 控制面持有：建/删 account、per-user key 签发）
#   vlm                  记忆提取 VLM（provider/api_base/api_key/model，OpenAI 兼容）
#   embedding.dense      检索热路径 embedding（免费/限速档不可用，PoC 实测 429）
#   rerank（可选，未配置时退化为向量排序）
#
# 启用平台集成（backend env，platform.yaml）：
#   OPENVIKING_ENABLED=true
#   OPENVIKING_BASE_URL=http://openviking-svc.agent-platform.svc.cluster.local:1933
#   OPENVIKING_ROOT_API_KEY=<root key>
# backend 启动自检：ENABLED=true 但客户端构造失败（URL/key 空）按未启用处理并 warn，
# 发布链路零接触（config.Load 与 NewVikingAdmin 双重门控）。
---
apiVersion: v1
kind: Secret
metadata:
  name: oaf-openviking-secret
  namespace: agent-platform
type: Opaque
stringData:
  # 完整 ov.conf JSON(entrypoint 经 OPENVIKING_CONF_CONTENT 落盘生成,已核实镜像机制):
  # server.auth_mode=api_key + root_api_key + vlm/embedding 模型段。占位示例——部署前用
  # 真实模型供给覆盖(.env.secrets 侧管理,与 backend OPENVIKING_ROOT_API_KEY 保持同值;
  # embedding/rerank 供给属 OpenViking 自身运维配置,免费/限速档不可用——实测 429)
  OPENVIKING_CONF_CONTENT: |-
    {
      "server": {"host": "0.0.0.0", "port": 1933, "auth_mode": "api_key",
                 "root_api_key": "CHANGE-ME-root-api-key"},
      "vlm": {"provider": "openai", "api_base": "https://llm-provider.example/v1",
              "api_key": "CHANGE-ME", "model": "vlm-model-name"},
      "embedding": {"dense": {"provider": "openai",
                              "api_base": "https://embedding-provider.example/v1",
                              "api_key": "CHANGE-ME", "model": "embedding-model-name",
                              "encoding_format": "float", "dimension": 1024}}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: agent-platform
  labels: { app: openviking }
spec:
  replicas: 1
  strategy: { type: Recreate }   # 单副本 + PVC RWO：滚动更新会双 Pod 抢卷，Recreate 保序
  selector: { matchLabels: { app: openviking } }
  template:
    metadata:
      labels: { app: openviking }
    spec:
      containers:
        - name: openviking
          # 官方镜像（ghcr.io 慢时用火山源：openviking-cn-beijing.cr.volces.com/volcengine/openviking）
          image: openviking-cn-beijing.cr.volces.com/volcengine/openviking:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 1933 }]
          env:
            - { name: OPENVIKING_PUBLIC_BASE_URL, value: "http://openviking-svc.agent-platform.svc.cluster.local:1933" }
            - { name: OPENVIKING_CONF_CONTENT, valueFrom: { secretKeyRef: { name: oaf-openviking-secret, key: OPENVIKING_CONF_CONTENT } } }
          volumeMounts:
            - { name: data, mountPath: /app/.openviking }
          readinessProbe:
            httpGet: { path: /health, port: 1933 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { memory: 1Gi, cpu: 250m }
            limits:   { memory: 3Gi, cpu: "2" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: platform-data }
---
apiVersion: v1
kind: Service
metadata:
  name: openviking-svc
  namespace: agent-platform
  labels: { app: openviking }
spec:
  selector: { app: openviking }
  ports: [{ port: 1933, targetPort: 1933 }]
  # 集群内 only：不建 Ingress（网络边界即 trusted/api_key 的信任边界，设计 §4/§10）；
  # subPath 共享 PVC（platform-data 的 openviking/ 目录），与业务包/文件同卷隔离
