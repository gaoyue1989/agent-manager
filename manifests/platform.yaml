# OAF 平台自举清单：namespace / 元数据库(MySQL8) / 共享 PVC / RBAC / platform-backend
apiVersion: v1
kind: Namespace
metadata:
  name: agent-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: oaf-mysql-secret
  namespace: agent-platform
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "OafPlatform2026"
  MYSQL_PASSWORD: "OafPlatform2026"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oaf-mysql-init
  namespace: agent-platform
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS oaf_platform DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS oaf_checkpoint DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    GRANT ALL ON oaf_platform.* TO 'oaf'@'%';
    GRANT ALL ON oaf_checkpoint.* TO 'oaf'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oaf-mysql-data
  namespace: agent-platform
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oaf-mysql
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: oaf-mysql }
  template:
    metadata:
      labels: { app: oaf-mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports: [{ containerPort: 3306 }]
          env:
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: oaf-mysql-secret, key: MYSQL_ROOT_PASSWORD } } }
            - { name: MYSQL_DATABASE, value: oaf_platform }
            - { name: MYSQL_USER, value: oaf }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: oaf-mysql-secret, key: MYSQL_PASSWORD } } }
          args: ["--max_connections=200", "--innodb_buffer_pool_size=256M"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["mysqladmin","ping","-h","127.0.0.1","-uoaf","-pOafPlatform2026"] }
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests: { memory: 512Mi, cpu: 250m }
            limits:   { memory: 1Gi, cpu: "1" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: oaf-mysql-data }
        - name: init
          configMap: { name: oaf-mysql-init }
---
apiVersion: v1
kind: Service
metadata:
  name: oaf-mysql
  namespace: agent-platform
spec:
  selector: { app: oaf-mysql }
  ports: [{ port: 3306, targetPort: 3306 }]
---
# Redis：session_event 事件流存储（Streams，见 docs/api-frontend-sse.md §12）
#
# 内存规格怎么来的（**待真实流量复核，勿直接照搬到生产规模**）：
#   每事件实测 ≈ 257 B。测法：按应用真实写入格式（字段 t/r/p、MAXLEN ~）灌 20,000 条
#   载荷 170 B 的条目，取 used_memory 增量 ÷ 条数；环境 redis 8.6.2、listpack 编码。
#   但规划仍按 ≈ 332 B 计，多留 28% 余量，理由是三条都指向「低估更危险」：
#     ① 实测在 8.6.2 上，而本清单固定的是 7.2-alpine，编码开销未必一致；
#     ② 生产 payload 分布不一定等同测试负载；
#     ③ noeviction 下估小的代价不是多占内存，而是**写入直接报错、回放缺段**。
#          × 1.15 安全系数 ≈ 0.38 KB
#   limit ≈ min(TTL 窗口内事件数, maxLenPerStream × 活跃 session 数) × 0.38 KB + 32 MB 基线
#   锚点事件数（实测）：4 个测试 session / 5 小时 = 265,014 条；最重一小时 223,885 条。
#   按 0.38 KB/条外推 ≈ 101 MB / ≈ 85 MB —— 那是**估算值**；若按实测的 257 B/条则是
#   ≈ 65 MiB / ≈ 55 MiB，两者之差就是上面那 28% 余量，属预期。
# 注意实测样本是**测试负载**，不是生产流量：先按 1gb 跑、盯 INFO memory，并发上来后重算。
#   limits 给到 maxmemory 的 1.5 倍，是因为 AOF rewrite 会 fork，写时复制可能瞬时接近 2 倍；
#   卡在 1gb 会让 Pod 被 cgroup OOM-kill（硬杀）而不是让 Redis 优雅报错。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oaf-redis-data
  namespace: agent-platform
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oaf-redis
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: oaf-redis }
  template:
    metadata:
      labels: { app: oaf-redis }
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports: [{ containerPort: 6379 }]
          # 每一条都是**必需的**，不是调优：
          #   appendonly yes + everysec  —— 崩溃最多丢 1 秒已刷出的事件；关掉则「持久回放」的承诺失效
          #   maxmemory-policy noeviction —— 用 LRU 淘汰 session 事件 = 静默丢回放数据，比任何故障模式都糟；
          #                                 到上限时写入必须响亮失败（append 返回 -1、回放报错）
          #   到顶时的行为已用真实 redis 实测（maxmemory 压到 8mb 灌满后逐条验证）：
          #     写入 XADD/ZADD/SET  -> OOM command not allowed（若用 allkeys-lru 则会静默淘汰事件）
          #     读取 XRANGE/XREVRANGE/ZRANGE/XLEN/TTL -> 正常返回（回放与 /status 活着）
          #     管理 EXPIRE(已有 key)/DEL/XTRIM -> 正常返回（不是 deny-oom）
          #   => 到顶不会卡死：TTL 仍能续期、键仍会过期，内存释放后实例自行恢复。
          #   save ""                    —— 持久性由 AOF 承担，去掉 RDB 即去掉周期性 fork 抖动
          #                                 （AOF 被截断时 aof-load-truncated 默认为 yes，仍能启动）
          #   auto-aof-rewrite-*         —— 不重整则 AOF 会无限增长，把 PVC 撑爆
          args: ["--appendonly", "yes",
                 "--appendfsync", "everysec",
                 "--maxmemory", "1gb",
                 "--maxmemory-policy", "noeviction",
                 "--save", "",
                 "--auto-aof-rewrite-percentage", "100",
                 "--auto-aof-rewrite-min-size", "256mb"]
          volumeMounts:
            - { name: data, mountPath: /data }
          # startupProbe 而非只靠 liveness：AOF 大时加载要几十秒，liveness 过早触发会把
          # Redis 反复杀掉→重载，形成一个看起来像「Redis 起不来」的死循环。
          # 预算 30 × 5s = 150s，之后才把存活判断交给 liveness。
          startupProbe:
            exec: { command: ["redis-cli","ping"] }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["redis-cli","ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli","ping"] }
            periodSeconds: 10
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits:   { memory: 1536Mi, cpu: "1" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: oaf-redis-data }
---
# 仅 ClusterIP，**无密码**：agent Pod 的环境变量来自 ConfigMap（oaf-release-agent-env），
# 在那里面放密码等于明文存放。与 MySQL 同级的信任模型（同 namespace 内可达）。
#
# ⚠️ 部署必做（不做则回放全挂，且是静默的配置错位）：
#   在 oaf-release-agent-env 里补一条
#     AGENT_REDIS_URL = redis://oaf-redis.agent-platform.svc.cluster.local:6379
#   否则 AgentRedisProperties 取默认值 redis://127.0.0.1:6379 —— 那指向 agent Pod **自己**的
#   localhost，容器里并没有 Redis。后果：XADD 连接失败（append 返回 -1、事件不落地）、
#   回放读不到、/status 直接 503。该默认值是为本地开发（application.yml 不入版本控制）设的，
#   进了集群必须显式覆盖。
apiVersion: v1
kind: Service
metadata:
  name: oaf-redis
  namespace: agent-platform
spec:
  selector: { app: oaf-redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
# 共享 PVC：OAF 配置包落盘
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-data
  namespace: agent-platform
spec:
  accessModes: ["ReadWriteOnce"]   # 单节点 Kind：多 Pod 挂同一 RWO 卷合法
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-backend
  namespace: agent-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-backend
  namespace: agent-platform
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["services","configmaps","persistentvolumeclaims","pods","pods/log"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get","list","watch","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-backend
  namespace: agent-platform
subjects:
  - kind: ServiceAccount
    name: platform-backend
    namespace: agent-platform
roleRef:
  kind: Role
  name: platform-backend
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-backend
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: platform-backend }
  template:
    metadata:
      labels: { app: platform-backend }
    spec:
      serviceAccountName: platform-backend
      containers:
        - name: backend
          image: platform-backend:v1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: MYSQL_DSN
              value: "oaf:OafPlatform2026@tcp(oaf-mysql.agent-platform.svc.cluster.local:3306)/oaf_platform?charset=utf8mb4&parseTime=True&loc=Local"
            - { name: NAMESPACE, value: agent-platform }
            - { name: DATA_ROOT, value: /data }
            - { name: AVAILABLE_IMAGES, value: "172.20.0.1:5001/agent-framework:latest|Agent Framework (registry)" }
            - { name: DEFAULT_IMAGE, value: "172.20.0.1:5001/agent-framework:latest" }
            - { name: INGRESS_CLASS, value: nginx }
            - { name: INGRESS_HOST, value: "172.20.0.3" }
            - { name: INGRESS_PORT, value: "30080" }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits:   { memory: 512Mi, cpu: 500m }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: platform-data }
---
apiVersion: v1
kind: Service
metadata:
  name: platform-backend
  namespace: agent-platform
spec:
  selector: { app: platform-backend }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: platform-backend-nodeport
  namespace: agent-platform
spec:
  type: NodePort
  selector: { app: platform-backend }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30880
