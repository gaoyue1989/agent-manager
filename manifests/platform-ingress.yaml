# platform-backend 对外暴露：REST 与 MCP 均为路径直通
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-backend-api
  namespace: agent-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # 包上传链路：入口须宽于后端应用上限（MaxZipSize 20MB），超限由 backend 返回
    # JSON 400——ingress-nginx 默认 proxy-body-size 1m 会以 HTML 413 拒绝（issue #165）；
    # 200m 与宿主机 nginx / platform-router 同口径
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: platform-backend, port: { number: 8080 } } }
          - path: /healthz
            pathType: Prefix
            backend: { service: { name: platform-backend, port: { number: 8080 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-backend-mcp
  namespace: agent-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # MCP upload_package 走 JSON+base64（20MB 包 → 27MB 请求体），与 /api 同口径放宽
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend: { service: { name: platform-backend, port: { number: 8080 } } }
