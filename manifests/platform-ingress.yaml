# platform-backend 对外暴露：REST 与 MCP 均为路径直通
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-backend-api
  namespace: agent-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: platform-backend, port: { number: 8080 } } }
          - path: /healthz
            pathType: Prefix
            backend: { service: { name: platform-backend, port: { number: 8080 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-backend-mcp
  namespace: agent-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend: { service: { name: platform-backend, port: { number: 8080 } } }
