# Prometheus 观测栈（tool-call-observability-design §三）：
#   - 抓取发现：kubernetes_sd(pod, agent-platform) + prometheus.io/* 注解
#     （业务 Pod 注解由发布链路写入，见 backend/internal/k8s/objects.go）
#   - 指标：agent-framework /actuator/prometheus（管理端口 9091，Micrometer）
#   - 持久化：共享 PVC platform-data subPath prometheus/（retention 31d ≥ 面板最大窗口 30d）
#   - 消费方：backend（PROMETHEUS_URL，PromQL 聚合出观测面板）+ Grafana（预置仪表盘）
# 镜像预置（离线 kind 集群）：docker pull prom/prometheus:v2.53.0 && docker save |
#   ctr -n k8s.io images import（步骤见 docs/deployment.md §二）。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: agent-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-reader
  namespace: agent-platform
rules:
  - apiGroups: [""]
    resources: [pods, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-reader
  namespace: agent-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: agent-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: agent-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    scrape_configs:
      # 自抓取
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      # 业务 agent（注解发现；指标自带 service/tool/result 标签，无需额外 relabel 注入）
      - job_name: oaf-agents
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [agent-platform]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # 便于按 Pod 过滤/排障（不影响指标自身 service 标签语义）
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: k8s_name
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=31d
          ports: [{ containerPort: 9090 }]
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits:   { memory: 512Mi, cpu: 500m }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus, subPath: prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          persistentVolumeClaim: { claimName: platform-data }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: agent-platform
spec:
  selector: { app: prometheus }
  ports:
    - { port: 9090, targetPort: 9090 }
