name: frontend-ci

# 触发：任意分支 push + 指向 master 的 PR（PR 门禁）
on:
  # push 仅 master（跑测试 + 发布镜像）；其余分支只在 PR 时触发（门禁检查）
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  # 按分支名分组 + 取消进行中的旧 run：同分支的 push 与 PR 双事件只保留最新一次
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # 目录变更检测：决定本次该跑哪些 job（不相关 job 会 Skipped，门禁视为通过）
  changes:
    name: 变更目录检测
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            workflows:
              - '.github/workflows/frontend-ci.yml'

  test:
    name: 单测 (lint + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests (node:test)
        working-directory: frontend
        run: npm run test
      - name: Build（含类型检查）
        working-directory: frontend
        run: npm run build

  build-push:
    name: 构建镜像并推送
    needs: [changes, test]
    if: (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true')
        && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 计算镜像 tag（短 commit id）
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            gaoyue1989/agent-manager-frontend:latest
            gaoyue1989/agent-manager-frontend:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
