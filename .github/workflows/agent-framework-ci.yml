name: agent-framework-ci

# 触发：任意分支 push + 指向 master 的 PR（PR 门禁）
# 去重：同分支上 push 会同时产生 PR 同步事件——PR 事件与 push 事件都触发时，
#       依靠 concurrency 按	ref 分组取消旧队列，避免双倍跑
on:
  push:
    branches-ignore: []        # 所有分支
  pull_request:
    branches: [master]

concurrency:
  # 按分支名分组 + 取消进行中的旧 run：同分支的 push 与 PR 双事件只保留最新一次
  # （两者产生同 head sha 的同名检查，任一失败都会卡住 PR 门禁）
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # 目录变更检测：决定本次该跑哪些 job（不相关 job 会 Skipped，门禁视为通过）
  changes:
    name: 变更目录检测
    runs-on: ubuntu-latest
    outputs:
      framework: ${{ steps.filter.outputs.framework }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # push 事件的路径比较需要完整历史
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            framework:
              - 'agent-framework/**'
            workflows:
              - '.github/workflows/agent-framework-ci.yml'

  test:
    name: 单测 (mvn test)
    needs: changes
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run agent-framework tests
        working-directory: agent-framework
        run: mvn -B test

  e2e-core:
    name: E2E 核心（API+UI）
    needs: [changes, test]
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
          MYSQL_DATABASE: agent_framework_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-pass
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_GROUP: core
      E2E_BASE_PORT: "8100"
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/agent_framework_e2e
      MYSQL_USER: e2e
      MYSQL_PASS: e2e-pass
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: agent-framework/e2e/package-lock.json }
      - name: 构建被测 jar
        working-directory: agent-framework
        run: mvn -B -q -DskipTests package
      - name: 安装 Playwright chromium
        working-directory: agent-framework/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 录制件校验
        working-directory: agent-framework/e2e
        run: node scripts/check-fixtures.mjs
      - name: 起环境并执行 core 组
        working-directory: agent-framework/e2e
        run: ./scripts/run.sh core
      - name: 失败取证
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-core
          path: |
            agent-framework/e2e/.runtime/
            agent-framework/e2e/playwright-report/
          retention-days: 5

  e2e-multi:
    name: E2E 多副本（R 组 + U9）
    needs: [changes, test]
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
          MYSQL_DATABASE: agent_framework_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-pass
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_GROUP: multi
      E2E_BASE_PORT: "8100"
      E2E_REPLICA_A: http://127.0.0.1:8101
      E2E_REPLICA_B: http://127.0.0.1:8102
      E2E_RUNTIME_DIR: /home/runner/work/agent-manager/agent-manager/agent-framework/e2e/.runtime
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/agent_framework_e2e
      MYSQL_USER: e2e
      MYSQL_PASS: e2e-pass
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: agent-framework/e2e/package-lock.json }
      - working-directory: agent-framework
        run: mvn -B -q -DskipTests package
      - name: 安装 Playwright chromium
        working-directory: agent-framework/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - working-directory: agent-framework/e2e
        run: node scripts/check-fixtures.mjs
      - working-directory: agent-framework/e2e
        run: ./scripts/run.sh multi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-multi
          path: |
            agent-framework/e2e/.runtime/
            agent-framework/e2e/playwright-report/
          retention-days: 5

  e2e-sandbox:
    name: E2E 沙箱（mock OpenSandbox）
    needs: [changes, test]
    if: needs.changes.outputs.framework == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
          MYSQL_DATABASE: agent_framework_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-pass
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_GROUP: sandbox
      E2E_BASE_PORT: "8100"
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/agent_framework_e2e
      MYSQL_USER: e2e
      MYSQL_PASS: e2e-pass
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: agent-framework/e2e/package-lock.json }
      - working-directory: agent-framework
        run: mvn -B -q -DskipTests package
      - name: 安装 Playwright chromium（X1 页面冒烟用）
        working-directory: agent-framework/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - working-directory: agent-framework/e2e
        run: node scripts/check-fixtures.mjs
      - working-directory: agent-framework/e2e
        run: ./scripts/run.sh sandbox
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-sandbox
          path: |
            agent-framework/e2e/.runtime/
            agent-framework/e2e/playwright-report/
          retention-days: 5

  build-push:
    name: 构建镜像并推送
    needs: [changes, test]
    if: (needs.changes.outputs.framework == 'true' || needs.changes.outputs.workflows == 'true')
        && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 计算镜像 tag（agentscope-{maven 版本}-v{日期}）
        id: meta
        working-directory: agent-framework
        run: |
          VERSION=$(mvn -q -B -DforceStdout -Dexpression=project.version help:evaluate)
          DATE=$(date -u +%Y%m%d)
          echo "tag=agentscope-${VERSION}-v${DATE}" >> "$GITHUB_OUTPUT"
          echo "镜像 tag: agentscope-${VERSION}-v${DATE} (commit ${GITHUB_SHA::7})"
      - name: 下载 OTel Java Agent（Dockerfile COPY 依赖，jar 不入库）
        working-directory: agent-framework
        run: |
          mkdir -p docker/otel
          curl -fSLo docker/otel/opentelemetry-javaagent.jar \
            "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.12.0/opentelemetry-javaagent.jar"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: agent-framework
          push: true
          tags: |
            gaoyue1989/agent-framework:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=agent-framework
          cache-to: type=gha,mode=max,scope=agent-framework
