name: agent-framework-ci

on:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 单测 (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run agent-framework tests
        working-directory: agent-framework
        run: mvn -B test

  e2e-core:
    name: E2E 核心（API+UI）
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
          MYSQL_DATABASE: agent_framework_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-pass
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_GROUP: core
      E2E_BASE_PORT: "8100"
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/agent_framework_e2e
      MYSQL_USER: e2e
      MYSQL_PASS: e2e-pass
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: agent-framework/e2e/package-lock.json }
      - name: 构建被测 jar
        working-directory: agent-framework
        run: mvn -B -q -DskipTests package
      - name: 安装 Playwright chromium
        working-directory: agent-framework/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 录制件校验
        working-directory: agent-framework/e2e
        run: node scripts/check-fixtures.mjs
      - name: 起环境并执行 core 组
        working-directory: agent-framework/e2e
        run: ./scripts/run.sh core
      - name: 失败取证
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-core
          path: |
            agent-framework/e2e/.runtime/
            agent-framework/e2e/playwright-report/
          retention-days: 5

  e2e-multi:
    name: E2E 多副本（R 组 + U9）
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
          MYSQL_DATABASE: agent_framework_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-pass
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_GROUP: multi
      E2E_BASE_PORT: "8100"
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/agent_framework_e2e
      MYSQL_USER: e2e
      MYSQL_PASS: e2e-pass
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: agent-framework/e2e/package-lock.json }
      - working-directory: agent-framework
        run: mvn -B -q -DskipTests package
      - name: 安装 Playwright chromium
        working-directory: agent-framework/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - working-directory: agent-framework/e2e
        run: node scripts/check-fixtures.mjs
      - working-directory: agent-framework/e2e
        run: ./scripts/run.sh multi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-multi
          path: |
            agent-framework/e2e/.runtime/
            agent-framework/e2e/playwright-report/
          retention-days: 5

  e2e-sandbox:
    name: E2E 沙箱（mock OpenSandbox）
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
          MYSQL_DATABASE: agent_framework_e2e
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-pass
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_GROUP: sandbox
      E2E_BASE_PORT: "8100"
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/agent_framework_e2e
      MYSQL_USER: e2e
      MYSQL_PASS: e2e-pass
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: agent-framework/e2e/package-lock.json }
      - working-directory: agent-framework
        run: mvn -B -q -DskipTests package
      - name: 安装 Playwright chromium（X1 页面冒烟用）
        working-directory: agent-framework/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - working-directory: agent-framework/e2e
        run: node scripts/check-fixtures.mjs
      - working-directory: agent-framework/e2e
        run: ./scripts/run.sh sandbox
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-sandbox
          path: |
            agent-framework/e2e/.runtime/
            agent-framework/e2e/playwright-report/
          retention-days: 5

  build-push:
    name: 构建镜像并推送
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 计算镜像 tag（agentscope-{maven 版本}-v{日期}）
        id: meta
        working-directory: agent-framework
        run: |
          VERSION=$(mvn -q -B -DforceStdout -Dexpression=project.version help:evaluate)
          DATE=$(date -u +%Y%m%d)
          echo "tag=agentscope-${VERSION}-v${DATE}" >> "$GITHUB_OUTPUT"
          echo "镜像 tag: agentscope-${VERSION}-v${DATE} (commit ${GITHUB_SHA::7})"
      - name: 下载 OTel Java Agent（Dockerfile COPY 依赖，jar 不入库）
        working-directory: agent-framework
        run: |
          mkdir -p docker/otel
          curl -fSLo docker/otel/opentelemetry-javaagent.jar \
            "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.12.0/opentelemetry-javaagent.jar"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: agent-framework
          push: true
          tags: |
            gaoyue1989/agent-framework:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=agent-framework
          cache-to: type=gha,mode=max,scope=agent-framework
