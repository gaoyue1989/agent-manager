name: platform-e2e-ci

# 平台（backend + frontend）真实 K8s E2E 门禁：kind 单节点集群 + 仓库自举清单 +
# 控制台全功能套件（Agent 创建/管理、模型连接、技能、工具、沙箱）。
#
# 当前定位：**必需检查**（2026-10-22 起纳入 master 分支保护）。用例按分片并行，各分片独占
# kind 集群（分片表见 e2e/console-split/run-all.sh），必需检查名落在汇总门禁 job
# platform-e2e 上：任一分片或变更检测失败即失败；按目录过滤，不相关变更的门禁直接通过。
# 触发：指向 master 的 PR + master push；按目录过滤。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: 变更目录检测
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - 'backend/**'
              - 'frontend/**'
              - 'manifests/**'
              - 'e2e/**'
              - '.github/actions/**'
              - '.github/workflows/platform-e2e-ci.yml'
              - 'charts/oaf-platform/**'
      - name: 分片表守卫（模块漏登记分片即失败）
        run: bash e2e/console-split/run-all.sh --check-shards

  e2e:
    name: E2E 平台分片（${{ matrix.shard }}）
    needs: changes
    # fork PR 拿不到 secrets（Docker Hub 限流风险高），先只跑同仓 PR / master push；
    # 需要覆盖 fork 时去掉第二个条件并接受匿名拉取。
    if: needs.changes.outputs.e2e == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: publish-chain
          - shard: agent-create
          - shard: agent-detail
          - shard: sandbox-config
          - shard: console-rest
            ui: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/platform-e2e-up
        id: up
        with:
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          agent-image: ${{ vars.E2E_AGENT_IMAGE }}

      - uses: azure/setup-helm@v4
        if: matrix.shard == 'publish-chain'
        with:
          version: v3.16.3

      # 数据面网关三态行为级门禁（nginx 真容器 + body 级 marker 防假放行；含 helm 渲染物
      # 分叉防回归与归属裁决契约案）。nginx -t 全过的错误落法仍可能行为错误，此 step 是
      # 该行为域的唯一门禁真相源（docs/implementation/10-gateway-auth.md §7）
      - name: 执行分片用例
        env:
          BASE: http://localhost:30080/api/v1
          FRONTEND_BASE: http://localhost:30881
          LLM_API_KEY: e2e-dummy-key
          LLM_MODEL: e2e-mock
          LLM_BASE_URL: http://mock-llm.agent-platform.svc.cluster.local:8080/v1
          E2E_AGENT_RUNTIME: ${{ steps.up.outputs.agent-runtime }}
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            publish-chain)
              bash e2e/scripts/router-auth-modes-verify.sh
              bash e2e/platform-e2e.sh
              ;;
            *)
              bash e2e/console-split/run-all.sh --shard "$SHARD"
              ;;
          esac

      - uses: actions/setup-node@v4
        if: matrix.ui
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: 控制台全功能 E2E（浏览器 UI）
        if: matrix.ui
        env:
          BASE: http://localhost:30080/api/v1
          FRONTEND: http://localhost:30881
          ADMIN_USER: admin
          ADMIN_PASS: OafConsole2026
          E2E_LLM_BASE_URL: http://mock-llm.agent-platform.svc.cluster.local:8080/v1
          E2E_LLM_API_KEY: e2e-dummy-key
          E2E_LLM_MODEL: e2e-mock
          E2E_AGENT_RUNTIME: ${{ steps.up.outputs.agent-runtime }}
        run: |
          cd e2e
          npm ci --no-audit --no-fund
          node console-ui-e2e.js

      - name: 采集集群状态（失败取证）
        if: failure()
        run: |
          mkdir -p /tmp/e2e-artifacts
          kubectl -n agent-platform get all,pvc,cm -o wide > /tmp/e2e-artifacts/k8s-all.txt 2>&1 || true
          kubectl -n agent-platform describe pods > /tmp/e2e-artifacts/k8s-describe.txt 2>&1 || true
          kubectl -n agent-platform logs deploy/platform-backend --tail=800 > /tmp/e2e-artifacts/backend.log 2>&1 || true
          kubectl -n agent-platform logs deploy/platform-frontend --tail=300 > /tmp/e2e-artifacts/frontend.log 2>&1 || true
          kubectl -n agent-platform logs deploy/mock-llm --tail=300 > /tmp/e2e-artifacts/mock-llm.log 2>&1 || true
          kubectl -n agent-platform logs deploy/mock-sandbox --tail=300 > /tmp/e2e-artifacts/mock-sandbox.log 2>&1 || true
          kubectl -n agent-platform logs deploy/platform-router --tail=300 > /tmp/e2e-artifacts/router.log 2>&1 || true

      - name: 上传失败取证
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-e2e-logs-${{ matrix.shard }}
          if-no-files-found: ignore
          path: |
            /tmp/e2e-artifacts/
            e2e/ci-artifacts/
          retention-days: 5

  platform-e2e:
    name: E2E 平台（kind + 控制台全功能）
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总分片结果
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_CHANGED: ${{ needs.changes.outputs.e2e }}
          SHARDS_RESULT: ${{ needs.e2e.result }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::变更目录检测未成功（$CHANGES_RESULT）"; exit 1
          fi
          if [ "$E2E_CHANGED" != true ] || [ "$SAME_REPO" != true ]; then
            echo "本次变更不涉及平台 E2E 或为 fork PR，分片按设计跳过"; exit 0
          fi
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::平台 E2E 分片结果：$SHARDS_RESULT"; exit 1
          fi
          echo "全部平台 E2E 分片通过"
