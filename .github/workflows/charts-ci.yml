name: charts-ci

# Helm chart 门禁：charts/** 此前无任何 CI 覆盖（近 7 天两次 chart 变更仅靠人工验证）。
# lint 校验模板语法/values schema，template 用 CI 占位值渲染全部对象（必填值缺失会在此红）。
# 2026-10-22 起纳入 master 分支保护必需检查。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: 变更目录检测
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.filter.outputs.charts }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            charts:
              - 'charts/**'
            workflows:
              - '.github/workflows/charts-ci.yml'

  lint:
    name: Chart 校验 (helm lint + template)
    needs: changes
    if: needs.changes.outputs.charts == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint
        run: helm lint charts/oaf-platform
      - name: helm template（CI 占位必填值，渲染全量对象）
        run: |
          helm template oaf charts/oaf-platform \
            --set 'images.business[0].image=example/agent-framework:ci' \
            --set 'images.business[0].label=Agent Framework CI' \
            --set external.mysql.host=mysql \
            --set external.mysql.password=ci \
            --set backend.jwtSecret=ci-secret \
            --set platformDefaults.seed.enabled=false > /tmp/chart-rendered.yaml
          test -s /tmp/chart-rendered.yaml

  # 业务面 chart（跨集群导出交付物，契约 §6.5）：与控制面 lint 并列的独立 job，
  # 未来转必需检查时单独勾选（新增 job 默认非必需，见根 AGENTS.md「分支保护」）
  lint-oaf-agent:
    name: oaf-agent Chart 校验 (helm lint + template)
    needs: changes
    if: needs.changes.outputs.charts == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint
        run: helm lint charts/oaf-agent
      - name: helm template（CI 占位必填值，渲染全量对象）
        run: |
          helm template ci-export charts/oaf-agent -f charts/oaf-agent/ci-values.yaml > /tmp/oaf-agent-rendered.yaml
          test -s /tmp/oaf-agent-rendered.yaml
          grep -q 'kind: Deployment' /tmp/oaf-agent-rendered.yaml
          grep -q 'kind: Job' /tmp/oaf-agent-rendered.yaml     # hook Job 必须渲染
          grep -q 'kind: Ingress' /tmp/oaf-agent-rendered.yaml
          grep -q 'kind: Secret' /tmp/oaf-agent-rendered.yaml
      - name: 最小 SA 断言（SA/Deployment/hook Job 三处禁自动挂载 token）
        run: |
          # 行首锚定匹配：注释行以 # 开头不命中，防回归锁被模板注释里的字面量喂饱失效
          helm template ci-export charts/oaf-agent -f charts/oaf-agent/ci-values.yaml --show-only templates/serviceaccount.yaml | grep -qE '^automountServiceAccountToken: false$'
          helm template ci-export charts/oaf-agent -f charts/oaf-agent/ci-values.yaml --show-only templates/deployment.yaml | grep -qE '^[[:space:]]*automountServiceAccountToken: false$'
          # Job 渲染整体被 mysql-init-job.yaml 的 {{- if .Values.mysql.createDatabase }} 包裹
          # （ci-values.yaml 恒为 true）：该值翻 false 则 Job 不渲染、此断言自会红（预期失败面，非误报）
          helm template ci-export charts/oaf-agent -f charts/oaf-agent/ci-values.yaml --show-only templates/mysql-init-job.yaml | grep -qE '^[[:space:]]*automountServiceAccountToken: false$'
      - name: TLS 形态缺键断言（表形态漏 secretName 必须 fail-fast，回归锁 issue #291）
        run: |
          # 表形态 enabled=true 漏写 secretName 键 → validate 必须 fail
          # （修复前 helper 经 include 渲出 <no value> 占位符绕过校验，静默渲染 secretName: "" 的坏 Ingress）
          if helm template tls-neg charts/oaf-agent -f charts/oaf-agent/ci-values.yaml \
              --set ingress.tls.enabled=true >/dev/null 2>&1; then
            echo "::error::表形态漏写 secretName 键未 fail-fast（issue #291 回归）"; exit 1
          fi
          # 布尔形态 tls=true 无 secretName 载体 → validate 必须 fail
          if helm template tls-bool charts/oaf-agent -f charts/oaf-agent/ci-values.yaml \
              --set ingress.tls=true >/dev/null 2>&1; then
            echo "::error::布尔形态 tls=true 未 fail-fast（issue #291 回归）"; exit 1
          fi
          # 完整表形态 → 正常渲染，secretName 原样透传
          helm template tls-pos charts/oaf-agent -f charts/oaf-agent/ci-values.yaml \
              --set ingress.tls.enabled=true --set ingress.tls.secretName=ci-tls-secret \
              --show-only templates/ingress.yaml | grep -q 'secretName: "ci-tls-secret"'
