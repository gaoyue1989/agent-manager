{{- $fullname := include "oaf-agent.fullname" . -}}
# 敏感 env（envFrom 第一源，stringData 明文；导出 v1 决议：values 明文承载敏感值）；
# 空 map 也渲染对象本身，保 Deployment envFrom 引用不悬空（契约 §6.2）。空值键剔除同 ConfigMap。
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-env-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oaf-agent.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secretEnv }}
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{- if ne ($v | toString) "" }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
