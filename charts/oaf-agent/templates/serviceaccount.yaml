{{/* 渲染期校验唯一挂载点（先例 oaf-platform serviceaccount.yaml 首行 include oaf.validate）：
     helm 渲染是全量或全不装，任一模板 fail 即整体失败，validate 在此一次覆盖全部模板 */}}
{{- include "oaf-agent.validate" . -}}
{{- $fullname := include "oaf-agent.fullname" . -}}
# 最小 ServiceAccount：业务 Pod 无任何 K8s API 依赖（配置经 initContainer 注入、env 经 envFrom、
# 流量经 Ingress 直连 {name}-svc，三条链路均不经平台/ apiserver），故不创建任何 RBAC。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oaf-agent.labels" . | nindent 4 }}
