{{- include "oaf.validate" . -}}
{{- $ns := include "oaf.namespace" . -}}
{{- $sa := include "oaf.backendServiceAccountName" . -}}
{{- if eq .Values.backend.kubeconfig.mode "synthesized" }}
# 仅 synthesized 模式创建专用 SA 与 RBAC：provided 模式使用外部 kubeconfig 凭据，
# 不创建任何 SA/RBAC，避免部署账号缺少 RBAC 权限导致 helm install 失败。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "oaf.labels" . | nindent 4 }}
{{- if .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml .Values.imagePullSecrets | nindent 2 }}
{{- end }}
---
# synthesized 模式（设计 §6.2）：显式 service-account-token Secret（1.24+ 不自动生成，
# 显式创建仍会被 token controller 填充）——kubeconfig 经 tokenFile 引用它。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oaf.fullname" . }}-backend-token
  namespace: {{ $ns }}
  labels:
    {{- include "oaf.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ $sa }}
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oaf.fullname" . }}-backend-kubeconfig
  namespace: {{ $ns }}
  labels:
    {{- include "oaf.labels" . | nindent 4 }}
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: {{ default "https://kubernetes.default.svc" .Values.backend.kubeconfig.server }}
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    contexts:
      - name: in-cluster
        context: { cluster: in-cluster, user: {{ include "oaf.fullname" . }}-backend }
    current-context: in-cluster
    users:
      - name: {{ include "oaf.fullname" . }}-backend
        user:
          tokenFile: /var/run/oaf-kubeconfig/token
{{- else if .Values.backend.kubeconfig.content }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oaf.fullname" . }}-backend-kubeconfig
  namespace: {{ $ns }}
  labels:
    {{- include "oaf.labels" . | nindent 4 }}
type: Opaque
stringData:
  kubeconfig: |
    {{- .Values.backend.kubeconfig.content | nindent 4 }}
{{- end }}
{{- if eq .Values.backend.kubeconfig.mode "synthesized" }}
---
{{- if .Values.rbac.clusterScope }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oaf.fullname" . }}-backend
  labels:
    {{- include "oaf.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["services","configmaps","persistentvolumeclaims","pods","pods/log"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get","list","create","update","delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get","list","watch","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oaf.fullname" . }}-backend
  labels:
    {{- include "oaf.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
roleRef:
  kind: ClusterRole
  name: {{ include "oaf.fullname" . }}-backend
  apiGroup: rbac.authorization.k8s.io
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oaf.fullname" . }}-backend
  namespace: {{ $ns }}
  labels:
    {{- include "oaf.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["services","configmaps","persistentvolumeclaims","pods","pods/log"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get","list","create","update","delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get","list","watch","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oaf.fullname" . }}-backend
  namespace: {{ $ns }}
  labels:
    {{- include "oaf.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
roleRef:
  kind: Role
  name: {{ include "oaf.fullname" . }}-backend
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- if not .Values.backend.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oaf.fullname" . }}-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "oaf.labels" . | nindent 4 }}
type: Opaque
stringData:
  mysql-dsn: {{ include "oaf.mysqlDSN" . | quote }}
  {{- if .Values.backend.authToken }}
  auth-token: {{ .Values.backend.authToken | quote }}
  {{- end }}
  # 控制台拆分（2026-10）：登录签发密钥 + 首个 admin 密码（敏感，均走 Secret）
  jwt-secret: {{ required "backend.jwtSecret 必填（或用 backend.existingSecret 提供 key jwt-secret）" .Values.backend.jwtSecret | quote }}
  {{- if .Values.backend.adminInitPassword }}
  admin-init-password: {{ .Values.backend.adminInitPassword | quote }}
  {{- end }}
{{- end }}
