{{- if and .Values.business.deploymentOverlay.enabled (not .Values.business.deploymentOverlay.existingConfigMap) }}
{{- $ns := include "oaf.namespace" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oaf.fullname" . }}-business-overlay
  namespace: {{ $ns }}
  labels:
    {{- include "oaf.labels" . | nindent 4 }}
data:
  # DEPLOYMENT_TEMPLATE：Strategic Merge Patch，作用于每个业务 Deployment。
  # 不变量校验见 backend validateDeployment（保留键/envFrom/挂载/selector 不可破坏）。
  overlay.yaml: |
    {{- if .Values.business.deploymentOverlay.raw }}
    {{- .Values.business.deploymentOverlay.raw | nindent 4 }}
    {{- else }}
    {{- toYaml .Values.business.deploymentOverlay.patch | nindent 4 }}
    {{- end }}
{{- end }}
{{- if and .Values.business.ingressOverlay.enabled (eq .Values.routing.mode "host") (not .Values.business.ingressOverlay.existingConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oaf.fullname" . }}-ingress-overlay
  namespace: {{ include "oaf.namespace" . }}
  labels:
    {{- include "oaf.labels" . | nindent 4 }}
data:
  # INGRESS_TEMPLATE（仅 host 模式）：host/path 为不变量，仅可追加注解/TLS。
  overlay.yaml: |
    {{- if .Values.business.ingressOverlay.raw }}
    {{- .Values.business.ingressOverlay.raw | nindent 4 }}
    {{- else }}
    {{- toYaml .Values.business.ingressOverlay.patch | nindent 4 }}
    {{- end }}
{{- end }}
