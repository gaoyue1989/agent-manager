<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eval-studio · 离线评测服务</title>
<style>
  :root{--bg:#0f1419;--panel:#1a2129;--panel2:#212a34;--line:#2d3947;--fg:#dbe4ee;--dim:#8496a9;
        --acc:#4da3ff;--ok:#3fb96f;--warn:#e0a83c;--err:#e06c5c;--mono:'SF Mono',Consolas,monospace}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
     font:14px/1.6 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0} .dim{color:var(--dim)} .grow{flex:1}
  .pill{padding:2px 12px;border-radius:12px;background:var(--panel2);font-size:12px}
  nav{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--line)}
  nav button{background:none;border:none;color:var(--dim);padding:8px 16px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent}
  nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
  main{padding:24px;max-width:1100px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px}
  .card h2{font-size:15px;margin:0 0 12px} .hint{font-weight:400;color:var(--dim);font-size:12px;margin-left:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500} .mono{font-family:var(--mono);font-size:12.5px}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
  .tag.ok{background:rgba(63,185,111,.15);color:var(--ok)} .tag.err{background:rgba(224,108,92,.15);color:var(--err)}
  .tag.run{background:rgba(77,163,255,.15);color:var(--acc)} .tag.dim{background:var(--panel2);color:var(--dim)}
  button.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
  button.btn:hover{border-color:var(--acc)} button.btn.pri{background:var(--acc);border-color:var(--acc);color:#08131f;font-weight:600}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:7px 10px;font-size:13px;width:100%}
  label{display:block;color:var(--dim);font-size:12px;margin:10px 0 4px}
  pre{background:#12181f;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-family:var(--mono);font-size:12.5px;max-height:420px}
  .ok{color:var(--ok)} .err{color:var(--err)} .warn{color:var(--warn)}
  .bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--acc)}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:8px;display:none}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
</style>
</head>
<body>
<header><h1>eval-studio</h1><span class="dim">离线评测服务 · 录制回放 / 链路评测 / 报告</span>
  <span class="grow"></span><span class="pill" id="active-profile">未选择档案</span>
  <button class="btn" id="token-btn" title="设置 eval-studio 访问 token（STUDIO_TOKEN）">token</button></header>
<nav id="nav">
  <button data-tab="dash" class="on">概览</button>
  <button data-tab="profiles">目标配置</button>
  <button data-tab="packs">数据包</button>
  <button data-tab="cases">用例库</button>
  <button data-tab="runs">评测任务</button>
  <button data-tab="compare">对比</button>
  <button data-tab="trends">趋势</button>
</nav>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
// 访问 token（issue #97）：首载优先 location.hash 的 #token=xxx（存 localStorage 后立即清 hash，
// 防 token 留在地址栏/历史记录），否则读 localStorage，仍无则弹窗输入（可取消=匿名继续，
// 服务端未设 STUDIO_TOKEN 时本就放行）。token 仅用于请求头，不拼入任何 HTML/onclick。
const authHeaders=()=>TOKEN?{'authorization':`Bearer ${TOKEN}`}:{};
const saveToken=t=>{t=(t||'').trim();
 if(t)localStorage.setItem('studio-token',t);else localStorage.removeItem('studio-token');TOKEN=t;};
let TOKEN='',AUTH_SKIP=false;  // AUTH_SKIP：用户放弃输入后置位——周期任务（10s refresh / run 轮询）遇 401 不再弹窗，经顶栏「token」按钮主动恢复
TOKEN=(()=>{const m=location.hash.match(/^#token=([^&]+)/);
 let t='';if(m){try{t=decodeURIComponent(m[1]);}catch{t='';}}  // 畸形百分号编码（如 #token=%）按无 token 处理，防 URIError 中断整页初始化
 if(t)saveToken(t);
 else if(!localStorage.getItem('studio-token')){saveToken(prompt('访问 token（未设 token 直接取消）')||'');AUTH_SKIP=!TOKEN;}
 if(TOKEN)history.replaceState(null,'',location.pathname+location.search);
 return localStorage.getItem('studio-token')||'';})();
const api=async(p,opt={})=>{const r=await fetch(p,{...opt,headers:{'content-type':'application/json',...authHeaders(),...(opt.headers||{})}});
  if(r.status===401){if(!AUTH_SKIP){saveToken(prompt('token 无效或缺失，请重新输入')||'');AUTH_SKIP=!TOKEN;
    toast(TOKEN?'token 已更新，请重试':'已跳过 token 输入，点右上角「token」可重新设置',false);}
   throw new Error(401);}
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.detail||j.error||r.status); return j;};
// HTML 转义须含单引号：id 等用户可控值曾拼进单引号实参的内联 onclick（存储型 XSS 沉淀点）；
// 现按钮一律 data-* + 事件委托，esc 仍作为所有插值的兜底防线
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>(v*100).toFixed(1)+'%';
function toast(m,ok=true){const t=$('#toast');t.textContent=m;t.style.display='block';
  t.style.borderColor=ok?'var(--ok)':'var(--err)';setTimeout(()=>t.style.display='none',2600);}
let tab='dash', packs=[], profiles=[], active=null;

async function refresh(){try{[profiles,active]=await api('/api/profiles').then(r=>[r.profiles,r.active]);
  const p=profiles.find(x=>x.id===active);
  $('#active-profile').innerHTML = p?`当前档案：<b>${esc(p.name)}</b>（${esc(p.spec.target_mode||'replay')}）`:'未选择档案';
 }catch(e){}}

const views={
 async dash(){ const [runs, pk] = await Promise.all([api('/api/runs'), api('/api/packages')]);
  const recent=runs.runs.slice(0,5);
  $('#main').innerHTML=`
  <div class="card"><h2>快速开始</h2>
   <p class="dim">① 上传 evalpack（collector/flywheel pack 产出）→ ② 人审转正用例 → ③ 选目标档案跑评测（replay 离线回放 / live 联机）→ ④ 查看报告。</p>
   <p>包 ${pk.packages.length} 个 · 档案 ${profiles.length} 个 · run ${runs.runs.length} 次</p></div>
  <div class="card"><h2>最近 run</h2>${recent.length?`<table><tr><th>run</th><th>类型</th><th>状态</th><th>通过率</th><th></th></tr>${
    recent.map(r=>`<tr><td class="mono">${esc(r.run_id)}</td><td>${r.type}</td>
    <td><span class="tag ${r.status==='done'?'ok':r.status==='error'?'err':'run'}">${esc(r.status)}</span></td>
    <td>${r.report?pct(r.report.summary.pass_rate):'-'}</td>
    <td><button class="btn" data-act="open-run" data-run-id="${esc(r.run_id)}">报告</button></td></tr>`).join('')}</table>`
    :'<span class="dim">暂无 run</span>'}</div>`;},

 async profiles(){ $('#main').innerHTML=`
  <div class="card"><h2>目标档案 <span class="hint">按 agent 的真实配置，可切换/保存/预检；评测另一个 agent = 切档案</span>
    <button class="btn pri" style="float:right" data-act="edit-profile">+ 新建档案</button></h2>
  <table id="pf-t"></table></div>
  <div class="card" id="pf-edit" style="display:none"></div>`;
  $('#pf-t').innerHTML=`<tr><th>档案</th><th>模式</th><th>关键配置</th><th>操作</th></tr>`+
   profiles.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="mono dim">${esc(p.id)}</div></td>
    <td><span class="tag ${p.spec.target_mode==='live'?'run':'ok'}">${esc(p.spec.target_mode||'replay')}</span></td>
    <td class="mono dim">${esc(JSON.stringify(p.spec.replay||p.spec.live||{})).slice(0,90)}</td>
    <td class="row">
     ${active===p.id?'<span class="tag ok">活跃</span>':`<button class="btn" data-act="activate-profile" data-id="${esc(p.id)}">设为活跃</button>`}
     <button class="btn" data-act="edit-profile" data-id="${esc(p.id)}">编辑</button>
     <button class="btn" data-act="precheck-profile" data-id="${esc(p.id)}">预检</button>
     <button class="btn" data-act="del-profile" data-id="${esc(p.id)}">删除</button></td></tr>`).join('');},

 async packs(){ $('#main').innerHTML=`
  <div class="card"><h2>数据包（evalpack）<span class="hint">flywheel pack / collector 打包产出</span></h2>
   <div class="row"><input type="file" id="pk-file" accept=".zip"><button class="btn pri" data-act="upload-pack">上传</button></div>
   <div style="margin-top:14px"><table><tr><th>包</th><th>会话</th><th>交互</th><th>置信度</th><th>操作</th></tr>
   ${packs.packages.map(p=>`<tr><td class="mono">${esc(p.pack_id)}</td>
     <td>${(p.manifest.sessions||[]).length}</td><td>${esc(JSON.stringify(p.manifest.stats||{}))}</td>
     <td>${(p.manifest.sessions||[]).filter(s=>s.confidence==='high').length} high</td>
     <td class="row"><button class="btn" data-act="show-pack" data-pack-id="${esc(p.pack_id)}">明细</button>
     <button class="btn" data-act="del-pack" data-pack-id="${esc(p.pack_id)}">删除</button></td></tr>`).join('')||'<tr><td colspan=5 class="dim">暂无数据包</td></tr>'}
   </table></div></div><div class="card" id="pk-detail" style="display:none"></div>`;},

 async cases(){ const cs=await api('/api/cases');
  $('#main').innerHTML=`<div class="card"><h2>用例库 <span class="hint">draft=包内草稿待人审；active=已转正可跑评测</span></h2>
   <table><tr><th>用例</th><th>状态</th><th>输入</th><th>期望（派生）</th><th>操作</th></tr>
   ${cs.cases.map(c=>`<tr><td class="mono">${esc(c.case_id)}</td>
    <td><span class="tag ${c.status==='active'?'ok':'dim'}">${esc(c.status)}</span></td>
    <td class="mono">${esc((c.spec.input||{}).message||'').slice(0,50)}</td>
    <td class="mono dim">${esc(JSON.stringify(c.spec.expected||{})).slice(0,90)}</td>
    <td>${c.status==='draft'?`<button class="btn pri" data-act="promote-case" data-pack-id="${esc(c.pack_id)}" data-case-id="${esc(c.case_id)}">转正</button>`:''}</td></tr>`).join('')
    ||'<tr><td colspan=5 class="dim">暂无用例（先上传数据包）</td></tr>'}</table></div>`;},

 async runs(){ const rs=await api('/api/runs');
  $('#main').innerHTML=`<div class="card"><h2>新建评测任务 <span class="hint">replay=离线回放（内置沙盒开箱即用）；live=联机打档案 base_url</span></h2>
   <div class="grid">
    <div><label>目标档案</label><select id="rn-profile">${profiles.map(p=>`<option value="${esc(p.id)}" ${p.id===active?'selected':''}>${esc(p.name)}（${esc(p.spec.target_mode||'replay')}）</option>`).join('')}</select>
     <label>数据包</label><select id="rn-pack">${packs.packages.map(p=>`<option value="${esc(p.pack_id)}">${esc(p.pack_id)}</option>`).join('')}</select></div>
    <div><label>类型</label><select id="rn-type"><option value="replay">replay（离线回放）</option><option value="live">live（联机评测）</option></select>
     <label>选项</label><div class="row"><label style="margin:0"><input type="checkbox" id="rn-judge" checked> LLM judge 评分</label></div></div></div>
   <div class="row" style="margin-top:14px"><button class="btn pri" data-act="create-run">运行</button></div></div>
  <div class="card"><h2>历史任务</h2><table><tr><th>run</th><th>类型</th><th>状态</th><th>通过率</th><th>漂移率</th><th>judge</th><th></th></tr>
   ${rs.runs.map(r=>`<tr><td class="mono">${esc(r.run_id)}</td><td>${r.type}</td>
    <td><span class="tag ${r.status==='done'?'ok':r.status.includes('fail')?'warn':r.status==='error'?'err':'run'}">${esc(r.status)}</span></td>
    <td>${r.report?pct(r.report.summary.pass_rate):'-'}</td>
    <td>${r.report&&r.report.summary.drift_rate!=null?r.report.summary.drift_rate:'-'}</td>
    <td>${r.report&&r.report.summary.score_avg!=null?r.report.summary.score_avg.toFixed(2):'-'}</td>
    <td class="row"><button class="btn" data-act="open-run" data-run-id="${esc(r.run_id)}">报告</button></td></tr>`).join('')
    ||'<tr><td colspan=7 class="dim">暂无 run</td></tr>'}</table></div>
  <div class="card" id="rn-detail" style="display:none"></div>`;},

 async compare(){ const rs=(await api('/api/runs')).runs.filter(r=>r.report);
  $('#main').innerHTML=`<div class="card"><h2>同 pack 双 run 并排对比 <span class="hint">产出回归结论（M4 验收）</span></h2>
   <div class="grid">
    <div><label>基准 run（A）</label><select id="cmp-a">${rs.map(r=>`<option value="${esc(r.run_id)}">${esc(r.run_id)}（${pct(r.report.summary.pass_rate)}）</option>`).join('')}</select></div>
    <div><label>对比 run（B）</label><select id="cmp-b">${rs.map((r,i)=>`<option value="${esc(r.run_id)}" ${i===1?'selected':''}>${esc(r.run_id)}（${pct(r.report.summary.pass_rate)}）</option>`).join('')}</select></div></div>
   <div class="row" style="margin-top:12px"><button class="btn pri" data-act="do-compare">对比</button></div>
   <div id="cmp-out" style="margin-top:16px"></div></div>`;
  if(rs.length>=2) doCompare(); },

 async trends(){ const t=await api('/api/trends');
  $('#main').innerHTML=`<div class="card"><h2>跨 run 趋势 <span class="hint">通过率 / judge 均分 / 漂移率</span></h2>
  <table><tr><th>run</th><th>类型</th><th>数据包</th><th>通过率</th><th>judge 均分</th><th>漂移率</th></tr>
  ${t.runs.map(r=>`<tr><td class="mono">${esc(r.run_id)}</td><td>${r.type}</td><td class="mono dim">${esc(r.pack_id||'-')}</td>
   <td>${pct(r.pass_rate)}</td><td>${r.score_avg!=null?r.score_avg.toFixed(2):'-'}</td><td>${r.drift_rate}</td></tr>`).join('')
   ||'<tr><td colspan=6 class="dim">暂无数据</td></tr>'}</table></div>`;},
};

// 报告渲染进 sandbox iframe（不带 allow-same-origin/allow-scripts：唯一 origin 且脚本全禁），
// 替代 window.open+document.write 的同源执行，阻断报告内被注入内容以 studio 同源身份携带凭据调用 API
async function openRun(id){const r=await api(`/api/runs/${id}`);
 if(!r.report){toast('报告尚未生成',false);return;}
 const html=await fetch(`/api/runs/${id}/report.html`,{headers:authHeaders()}).then(x=>x.text());
 $('#run-view')?.remove();
 const ov=document.createElement('div');ov.id='run-view';
 ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:99';
 ov.innerHTML=`<div style="width:min(1000px,94vw);height:88vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden">
  <div class="row" style="padding:10px 14px;border-bottom:1px solid var(--line)"><b>评测报告</b><span class="mono dim">${esc(id)}</span><span class="grow"></span><button class="btn" data-act="close-run">关闭</button></div>
  <iframe style="flex:1;border:0;width:100%" sandbox></iframe></div>`;
 ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
 document.body.appendChild(ov);
 ov.querySelector('iframe').srcdoc=html;}
async function activateProfile(id){await api(`/api/profiles/${id}/activate`,{method:'POST'});toast('已切换活跃档案');refresh();views.profiles();}
async function precheckProfile(id){const r=await api(`/api/profiles/${id}/precheck`,{method:'POST'});toast('预检完成：'+JSON.stringify(r));}
async function delProfile(id){if(!confirm('删除档案？'))return;await api(`/api/profiles/${id}`,{method:'DELETE'});refresh();views.profiles();}
function editProfile(id){const box=$('#pf-edit');box.style.display='block';
 const p=profiles.find(x=>x.id===id);
 // textarea 内容上下文：esc 转实体后浏览器还原为原始文本，textarea.value 即未转义 JSON（勿再对 .value 二次转义）
 box.innerHTML=`<h2>${p?'编辑':'新建'}目标档案</h2><label>档案 JSON（secrets_ref 支持 env:VAR 引用）</label>
  <textarea id="pf-json" rows="12" class="mono">${esc(JSON.stringify(p?{...p.spec,id:p.id,name:p.name}:{
   id:'prof-',name:'',agent:{oaf_slug:''},target_mode:'replay',
   replay:{pack_policy:'latest',harness:'builtin-stub',strictness:'strict'},
   judge:{},secrets_ref:{}
  },null,2))}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn pri" data-act="save-profile">保存</button></div>`;}
async function saveProfile(){let spec;
 try{spec=JSON.parse($('#pf-json').value);}
 catch(e){return toast('档案 JSON 解析失败：'+e.message,false);}
 const pid=spec&&spec.id;
 if(!pid||!pid.startsWith('prof-'))return toast('id 必填且以 prof- 开头',false);
 // 已存在 id 走 PUT 更新（POST 对已存在 id 一律 409），新建走 POST
 const exists=profiles.some(x=>x.id===pid);
 await api(exists?`/api/profiles/${encodeURIComponent(pid)}`:'/api/profiles',
  {method:exists?'PUT':'POST',body:JSON.stringify(spec)});
 toast('已保存');views.profiles();}
async function uploadPack(){const f=$('#pk-file').files[0];if(!f)return toast('先选择 zip',false);
 const fd=new FormData();fd.append('file',f);
 const r=await fetch('/api/packages',{method:'POST',body:fd,headers:authHeaders()});const j=await r.json();
 if(!r.ok)return toast(j.detail||'上传失败',false);
 toast(`已导入 ${j.pack_id}（${j.sessions} 会话）`);load();}
async function showPack(id){const d=await api(`/api/packages/${id}`);const box=$('#pk-detail');box.style.display='block';
 box.innerHTML=`<h2>${esc(id)} 会话明细</h2><table><tr><th>sid</th><th>置信度</th><th>轮次</th><th>终答</th></tr>
 ${d.sessions.map(s=>`<tr><td class="mono">${esc(s.sid)}</td>
  <td><span class="tag ${s.confidence==='high'?'ok':'dim'}">${esc(s.confidence)}</span></td>
  <td>${(s.turns||[]).length}</td><td class="mono">${esc(s.final_output||'').slice(0,60)}</td></tr>`).join('')}</table>`;}
async function delPack(id){if(!confirm('删除数据包？'))return;await api(`/api/packages/${id}`,{method:'DELETE'});load();}
async function promoteCase(pid,cid){await api('/api/cases/promote',{method:'POST',body:JSON.stringify({pack_id:pid,case_id:cid})});
 toast('已转正');views.cases();}
async function doCompare(){const a=$('#cmp-a').value,b=$('#cmp-b').value;
 if(a===b) return toast('请选择两个不同的 run',false);
 let r; try{ r=await api(`/api/compare?run_a=${a}&run_b=${b}`);}catch(e){ return toast(e.message,false); }
 const c=r.conclusion;
 const badge=v=>({'regression':'<span class="tag err">回归</span>','improved':'<span class="tag ok">改进</span>',
   'stable_pass':'<span class="tag ok">稳定</span>','both_failed':'<span class="tag dim">两侧失败</span>',
   'new_in_b':'<span class="tag run">B新增</span>','removed_in_b':'<span class="tag dim">B移除</span>'}[v]||esc(v));
 $('#cmp-out').innerHTML=`
  <div class="card"><h2>结论：<span class="${c.regressions?'err':'ok'}">${esc(c.verdict)}</span></h2>
   <div class="row">
    <div class="stat"><b>${c.regressions}</b><span>回归用例</span></div>
    <div class="stat"><b>${c.improvements}</b><span>改进用例</span></div>
    <div class="stat"><b>${c.stable_pass}</b><span>稳定通过</span></div>
    <div class="stat"><b>${c.both_failed}</b><span>两侧失败</span></div>
    <div class="stat"><b>${pct(c.pass_rate_a)} → ${pct(c.pass_rate_b)}</b><span>通过率 A → B</span></div>
    <div class="stat"><b>${c.drift_a} → ${c.drift_b}</b><span>漂移率 A → B</span></div></div></div>
  <div class="card"><h2>逐用例对比</h2><table>
   <tr><th>用例</th><th>结论</th><th>A 状态</th><th>B 状态</th><th>A/B 漂移</th><th>A/B judge</th><th>差异检查项</th><th>终答 A → B</th></tr>
   ${r.cases.map(x=>`<tr><td class="mono">${esc(x.case_id)}</td><td>${badge(x.verdict)}</td>
    <td>${esc(x.status_a)}</td><td>${esc(x.status_b)}</td>
    <td>${x.drift_a??'-'} / ${x.drift_b??'-'}</td>
    <td>${x.score_a??'-'} / ${x.score_b??'-'}</td>
    <td class="mono">${x.checks_diff.length?x.checks_diff.map(d=>`${esc(d.name)}${d.passed_a?'✔':'✘'}→${d.passed_b?'✔':'✘'}`).join('<br>'):'-'}</td>
    <td class="mono dim">${esc(x.final_a||'').slice(0,60)}<br>→ ${esc(x.final_b||'').slice(0,60)}</td></tr>`).join('')}
  </table></div>`;};

async function createRun(){const body={type:$('#rn-type').value,profile_id:$('#rn-profile').value,
  pack_id:$('#rn-pack').value||undefined,judge:$('#rn-judge').checked};
 const r=await api('/api/runs',{method:'POST',body:JSON.stringify(body)});
 toast(`run ${r.run_id} 已提交`);views.runs();
 const t=setInterval(async()=>{const d=await api(`/api/runs/${r.run_id}`);
  if(d.status!=='queued'&&d.status!=='running'){clearInterval(t);views.runs();}},2000);};

async function switchTab(t){tab=t;$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
 await load();
 try{await views[t]();}catch(e){$('#main').innerHTML=`<div class="card"><span class="err">${esc(e.message)}</span></div>`;}}
async function load(){await refresh(); try{packs=await api('/api/packages');}catch(e){}}
$$('#nav button').forEach(b=>b.onclick=async()=>{switchTab(b.dataset.tab);});
// 事件委托：动态渲染按钮统一经 data-act 分发（id 只走 data-* 属性 + esc 转义，
// 不再拼进内联 onclick 的 JS 字符串实参，消除属性内代码注入这一类问题）
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');
 if(!b) return;
 const id=b.dataset.id, runId=b.dataset.runId, packId=b.dataset.packId, caseId=b.dataset.caseId;
 switch(b.dataset.act){
  case 'open-run': openRun(runId); break;
  case 'close-run': $('#run-view')?.remove(); break;
  case 'edit-profile': editProfile(id); break;
  case 'activate-profile': activateProfile(id); break;
  case 'precheck-profile': precheckProfile(id); break;
  case 'del-profile': delProfile(id); break;
  case 'save-profile': saveProfile(); break;
  case 'upload-pack': uploadPack(); break;
  case 'show-pack': showPack(packId); break;
  case 'del-pack': delPack(packId); break;
  case 'promote-case': promoteCase(packId, caseId); break;
  case 'create-run': createRun(); break;
  case 'do-compare': doCompare(); break;
 }});

$('#token-btn').onclick=()=>{saveToken(prompt('访问 token（留空=匿名）')||'');AUTH_SKIP=!TOKEN;
 switchTab(tab);};  // switchTab 内含 load(refresh)+当前视图重渲染：401 错误卡片随即被正常内容替换，不留陈旧报错
switchTab('dash'); setInterval(refresh,10000);
</script>
</body>
