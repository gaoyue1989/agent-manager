# 采集工作站：collector（录制代理）+ eval-studio（评测服务：打包/回放/评测/报告）
# 用法：
#   ADMIN_TOKEN=xxx [STUDIO_TOKEN=yyy] docker compose up -d
#   collector 控制台 http://<host>:18300 → 接入向导；eval-studio 绑定回环 127.0.0.1:18400，
#   本机浏览器直接打开，远程访问走 SSH 隧道/反代（ssh -L 18400:127.0.0.1:18400 <host>）；
#   STUDIO_TOKEN 非空时 studio /api/* 需 Authorization: Bearer <token>（页面首访弹窗输入）；
#   同值自动注入 collector 的 EVAL_PACKAGER_TOKEN，「数据打包」容器间转调照常工作
#
# 两服务共享 ./collector-data：studio 的打包直接读取 collector 录制数据，
# 测试环境 MySQL/Redis 只读凭据按需注入（用于会话骨架导出；不提供则按
# X-Eval-Session 头 + 内容指纹做关联）。
services:
  collector:
    image: gaoyue1989/eval-collector:latest
    container_name: eval-collector
    ports:
      - "18200-18202:18200-18202"   # 数据面：LLM / 沙箱 / MCP
      - "18300:18300"               # 管理控制台
    volumes:
      - ./collector-data:/var/lib/eval-collector
      - ./collector-conf:/etc/eval-collector
    environment:
      EVAL_COLLECTOR_ADMIN_TOKEN: "${ADMIN_TOKEN:?请设置 ADMIN_TOKEN}"
      EVAL_PACKAGER_URL: http://studio:18400/api/packs/from-collector  # 「数据打包」转调 studio 出完整 evalpack
      EVAL_PACKAGER_TOKEN: "${STUDIO_TOKEN:-}"   # 与 studio 的 STUDIO_TOKEN 同值：转调自动带 Bearer（空=studio 不启用鉴权）
    restart: unless-stopped

  studio:
    image: gaoyue1989/eval-studio:latest
    container_name: eval-studio
    depends_on: [collector]
    ports:
      - "127.0.0.1:18400:18400"   # 绑回环收敛暴露面（issue #97）：远程访问走 SSH 隧道/反代
    volumes:
      - ./collector-data:/var/lib/eval-collector          # 共享录制卷：studio 直接出完整 evalpack
      - ./studio-data:/data                               # evalpack / runs / studio.db
    environment:
      STUDIO_DATA_DIR: /data
      # 访问 token（空=不启用鉴权；非空时 /api/* 需 Bearer，页面首访弹窗输入）；
      # 同值已透传 collector（EVAL_PACKAGER_TOKEN），控制台「数据打包」转调自动带 Bearer
      STUDIO_TOKEN: "${STUDIO_TOKEN:-}"
      STUDIO_COLLECTOR_DATA: /var/lib/eval-collector      # 使 collector 控制台「数据打包」可直接出包
      # 上传 zip 大小上限（可选，字节，默认 268435456 = 256MB，超限返回 413）
      # STUDIO_MAX_UPLOAD_BYTES: "268435456"
      # 会话骨架导出（可选，注入后打包关联更精确；凭据用只读账号）
      EVAL_MYSQL_URL: "${EVAL_MYSQL_URL:-}"
      EVAL_REDIS_URL: "${EVAL_REDIS_URL:-}"
      # judge 模型（评测打分；也可在 studio 目标档案里按 agent 单独配置）
      EVAL_LLM_BASE_URL: "${EVAL_JUDGE_LLM_BASE_URL:-}"
      EVAL_LLM_API_KEY: "${EVAL_JUDGE_LLM_API_KEY:-}"
      EVAL_LLM_MODEL: "${EVAL_JUDGE_LLM_MODEL:-}"
    restart: unless-stopped
