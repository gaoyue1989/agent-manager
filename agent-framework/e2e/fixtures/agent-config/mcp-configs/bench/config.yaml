server: bench
vendor: bench
version: "1.0.0"

connection:
  type: streamableHttp
  url: http://172.17.0.1:18082/mcp
  timeout: 60

# 压测 MCP 为只读语义，避免 HITL 拦截把请求打成 permission_ask 暂停
permissions:
  read_only: true
  tools:
    bench_echo: allow

# 用户级 header 注入 + chat 请求级透传（e2e 断言入口）：工具调用按调用方 userId 注入
# X-User-Id、按调用方 chat 请求 Authorization 原值透传；mock /last-call 回读校验。
# on-missing: passthrough——S5 主流程不携带 Authorization，缺值跳过该头（其余映射
# 仍按值注入）；S5b 携带 Authorization 断言透传与 _meta 剥离
# arguments 节（mcp-header-arguments-injection-design）：请求头 taskId 注入工具入参
# （S5c 断言）；参数通道缺值恒跳过，与 on-missing 无关
userHeaders:
  headers:
    X-User-Id: userId
    Authorization: reqHeader:authorization
  arguments:
    taskId: reqHeader:taskid
  on-missing: passthrough
