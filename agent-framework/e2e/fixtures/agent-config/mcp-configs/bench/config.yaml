server: bench
vendor: bench
version: "1.0.0"

connection:
  type: streamableHttp
  url: http://172.17.0.1:18082/mcp
  timeout: 60

# 压测 MCP 为只读语义，避免 HITL 拦截把请求打成 permission_ask 暂停
permissions:
  read_only: true
  tools:
    bench_echo: allow

# 用户级 header 注入（e2e 断言入口）：工具调用按调用方 userId 注入 X-User-Id，
# mock /last-call 回读校验（缺值默认 deny，fail-closed）
userHeaders:
  headers:
    X-User-Id: userId
