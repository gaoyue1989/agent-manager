server:
  port: ${SERVER_PORT:8100}

# 日志配置
logging:
  file:
    path: ${LOG_PATH:${user.home}/logs/agent-framework}
  level:
    root: INFO
    io.agentmanager.framework: ${APP_LOG_LEVEL:INFO}

spring:
  application:
    name: agent-framework
  main:
    banner-mode: off
  servlet:
    multipart:
      max-file-size: ${FILE_UPLOAD_MAX_MB:20}MB
      max-request-size: ${FILE_UPLOAD_MAX_MB:20}MB
  # 版本化 schema/数据迁移（db/migration/V*.sql，数据源取唯一的 DataSource bean）：
  # - 全新库：从 V1 基线起完整重建；
  # - 存量库（有表、无 flyway_schema_history）：baseline 到 baseline-version
  #   （V1..V5 的 DDL 现网均已就位），仅执行之后的增量（V6 存量回填起）；
  # - 多副本同时启动由 Flyway 历史表锁互斥，仅一副本执行迁移，失败即启动失败。
  # 此后表结构/数据演进一律新增 V 文件，禁止在 Store 构造器里手工 DDL（已全部移除）。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 5

agent:
  config-dir: ${AGENT_CONFIG_DIR:}
  workspace-dir: ${AGENT_WORKSPACE_DIR:}
  llm:
    api-key: ${LLM_API_KEY:}
    model-id: ${LLM_MODEL_ID:}
    base-url: ${LLM_BASE_URL:}
    provider: ${LLM_PROVIDER:openai}
    temperature: ${LLM_TEMPERATURE:0.3}
    max-tokens: ${LLM_MAX_TOKENS:16384}
    timeout: ${LLM_TIMEOUT:120}
    enable-thinking: ${LLM_ENABLE_THINKING:false}
    context-length: ${LLM_CONTEXT_LENGTH:0}
    reasoning-effort: ${LLM_REASONING_EFFORT:}
    frequency-penalty: ${LLM_FREQUENCY_PENALTY:}
  server:
    host: ${SERVER_HOST:0.0.0.0}
    port: ${SERVER_PORT:8100}
  checkpoint:
    jdbc-url: ${CHECKPOINT_JDBC_URL:jdbc:mysql://127.0.0.1:3307/agent_manager_test}
    username: ${CHECKPOINT_USERNAME:agent_manager}
    password: ${CHECKPOINT_PASSWORD:Agent@Manager2026}
    db-name: ${CHECKPOINT_DB_NAME:}
  # 会话消息轨归档（压缩后历史可查，docs/session-history-archive-design.md）
  # true = AgentState 落库时 write-through 归档到 session_message，history 返回归档合并视图
  # false = 完全回退现状（不写归档表、history 仅读 agent_state）
  history:
    archive-enabled: ${AGENT_HISTORY_ARCHIVE_ENABLED:true}
  sandbox:
    enabled: ${SANDBOX_ENABLED:false}
    image: ${SANDBOX_IMAGE:opensandbox/code-interpreter:v1.1.0}
    timeout-minutes: ${SANDBOX_TIMEOUT_MINUTES:60}
    memory-mb: ${SANDBOX_MEMORY_MB:1024}
    cpu-count: ${SANDBOX_CPU_COUNT:1}
    execd-grace-shutdown: ${SANDBOX_EXECD_GRACE_SHUTDOWN:100ms}
    projection-enabled: ${SANDBOX_PROJECTION_ENABLED:true}
    guard-enabled: ${SANDBOX_GUARD_ENABLED:true}
    guard-lease-seconds: ${SANDBOX_GUARD_LEASE_SECONDS:900}
    opensandbox:
      server-url: ${OPENSANDBOX_SERVER_URL:192.168.31.155:8090}
      api-key: ${OPENSANDBOX_API_KEY:}
  file:
    upload-enabled: ${FILE_UPLOAD_ENABLED:true}
    upload-max-mb: ${FILE_UPLOAD_MAX_MB:20}
    upload-max-pending: ${FILE_UPLOAD_MAX_PENDING:20}
    upload-allowed-mime: ${FILE_UPLOAD_ALLOWED_MIME:image/*,text/plain,text/markdown,text/csv,application/pdf,application/vnd.openxmlformats-officedocument.*,application/vnd.ms-*,application/zip,application/x-zip-compressed}
    image-max-mb: ${FILE_IMAGE_MAX_MB:5}
    image-inline-total-mb: ${FILE_IMAGE_INLINE_TOTAL_MB:15}
    present-max-mb: ${FILE_PRESENT_MAX_MB:50}
    download-enabled: ${FILE_DOWNLOAD_ENABLED:true}
    retention-days: ${FILE_RETENTION_DAYS:7}
    # 存储后端：注意键名平铺（storage-type 等）与 FileConfig record 字段
    # storageType/storageS3Endpoint 等一一对应——不能嵌套 storage: 层，
    # 否则 binder 匹配不到字段、全部回退默认值（S3 必空导致启动失败）
    # present_url 外部交付物代理下载的前缀白名单（逗号分隔；空=禁用外部交付，防 SSRF）
    external-url-prefixes: ${FILE_EXTERNAL_URL_PREFIXES:}
    storage-type: ${FILE_STORAGE_TYPE:local}
    storage-local-dir: ${FILE_STORAGE_LOCAL_DIR:/data/files}
    storage-s3-endpoint: ${FILE_STORAGE_S3_ENDPOINT:}
    storage-s3-access-key: ${FILE_STORAGE_S3_ACCESS_KEY:}
    storage-s3-secret-key: ${FILE_STORAGE_S3_SECRET_KEY:}
    storage-s3-bucket: ${FILE_STORAGE_S3_BUCKET:agent-files}
  # durable-sse-plan §3.3：SSE 可靠传输配置
  sse:
    heartbeat-seconds: ${AGENT_SSE_HEARTBEAT_SECONDS:20}
    sinks-eviction-minutes: ${AGENT_SSE_SINKS_EVICTION_MINUTES:5}
    sinks-buffer-size: ${AGENT_SSE_SINKS_BUFFER_SIZE:256}
  # session_event 事件流存储（Redis Streams，见 AgentRedisProperties record）
  # 键名与 AgentRedisProperties 字段一一对应；每个叶子在代码里都有 @DefaultValue，
  # 所以本段缺失也能起来 —— 但**别**依赖那些默认值：它们指向 127.0.0.1:6379。
  # 集群里必须用 AGENT_REDIS_URL 覆盖成 redis://oaf-redis.agent-platform.svc…:6379，
  # 否则 Pod 去连自己的 localhost，事件不落地、回放全挂（详见 oaf-redis Service 注释）。
  redis:
    url: ${AGENT_REDIS_URL:redis://127.0.0.1:6379}
    # 命令超时：Lettuce 默认**关闭**命令超时，不设则一条命令可无限期占住 Tomcat 线程
    command-timeout-ms: ${AGENT_REDIS_COMMAND_TIMEOUT_MS:2000}
    connect-timeout-ms: ${AGENT_REDIS_CONNECT_TIMEOUT_MS:2000}
    # 单 session 事件条数上限（内存兜底，非可选优化）
    max-len-per-stream: ${AGENT_REDIS_MAX_LEN_PER_STREAM:250000}
    # 连接模式：standalone | cluster（sentinel 暂不支持；设计见 docs/redis-cluster-prefix-design.md）
    mode: ${AGENT_REDIS_MODE:standalone}
    # cluster 模式种子节点（逗号分隔）；空 = 回落上面 url 作单种子，拓扑自动发现
    cluster-nodes: ${AGENT_REDIS_CLUSTER_NODES:}
    # key 统一前缀（多 Agent 共用 oaf-redis 的隔离切分）；空 = 不加前缀（行为与存量部署一致）。
    # 改前缀后旧 key 不可见（靠 TTL 消亡），须在首次部署时定好；不能含 { }（hash tag 语法）
    prefix: ${AGENT_REDIS_PREFIX:}
  # Agent Protocol（远程子 agent 服务端，travel-fulfillment agent-protocol 设计 §6/§7/§8 member）：
  # 默认关闭——enabled=false 时不注册 /tasks* 端点、不装配认证 filter，存量服务零影响。
  # enabled=true 时 authToken 必填（缺失启动即失败，fail-fast，设计 §6.2）。
  # SDK 命名空间的同步映射见下方 agentscope.agent-protocol.*（同一批环境变量双落点）。
  agent-protocol:
    enabled: ${AGENT_PROTOCOL_ENABLED:false}
    auth-token: ${AGENT_PROTOCOL_AUTH_TOKEN:}
    # 本地 FS TaskStore 路径（agent_fs bean override 生效时不使用，§7 退化路径；禁止指向只读的 /config）
    task-store: ${AGENT_PROTOCOL_TASK_STORE:}
    retention-days: ${AGENT_PROTOCOL_TASK_RETENTION_DAYS:7}
    # 以下三项为 lead 端 / RemoteConfirmBridge（桥组件，后续里程碑）预留
    remote-confirm-ttl-hours: ${AGENT_REMOTE_CONFIRM_TTL_HOURS:24}
    remote-poll-seconds: ${AGENT_REMOTE_POLL_SECONDS:5}
    remote-headers-json: ${AGENT_REMOTE_HEADERS_JSON:}
    # 远程 spawn 强制同步等待（lead 端，设计 §16 实测）：SDK 远程 spawn 恒异步受理、
    # 收割全靠模型自觉不可靠——注入 SDK force_sync 属性让 spawn 阻塞等子任务完成、
    # 结果确定性回流。仅影响纯 spawn 轮次；无远程声明的服务无消费方、无副作用
    remote-spawn-sync-wait: ${AGENT_REMOTE_SPAWN_SYNC_WAIT:true}
    remote-spawn-sync-wait-seconds: ${AGENT_REMOTE_SPAWN_SYNC_WAIT_SECONDS:120}
  # Harness 运行时参数（默认值与参数化前硬编码值一致，见 HarnessConfig record）
  harness:
    # ReAct 推理
    max-iters: ${AGENT_REACT_MAX_ITERS:20}
    # LLM API HTTP 超时（秒）
    http-connect-timeout-seconds: ${AGENT_HTTP_CONNECT_TIMEOUT_SECONDS:30}
    http-read-timeout-seconds: ${AGENT_HTTP_READ_TIMEOUT_SECONDS:180}
    http-write-timeout-seconds: ${AGENT_HTTP_WRITE_TIMEOUT_SECONDS:30}
    # Memory
    # 记忆总开关：false = 完全关闭（不注册 memory_* 工具 + 不执行 flush/整合；沙箱不再注入/回写记忆文件）
    memory-enabled: ${AGENT_MEMORY_ENABLED:true}
    memory-flush-throttle-minutes: ${AGENT_MEMORY_FLUSH_THROTTLE_MINUTES:10}
    memory-consolidation-max-tokens: ${AGENT_MEMORY_CONSOLIDATION_MAX_TOKENS:8000}
    memory-consolidation-min-gap-minutes: ${AGENT_MEMORY_CONSOLIDATION_MIN_GAP_MINUTES:60}
    # Compaction
    compaction-trigger-messages: ${AGENT_COMPACTION_TRIGGER_MESSAGES:30}
    compaction-keep-messages: ${AGENT_COMPACTION_KEEP_MESSAGES:10}
    # 压缩前先刷写记忆（记忆 hooks 关闭时此项失效）
    compaction-flush-before-compact: ${AGENT_COMPACTION_FLUSH_BEFORE_COMPACT:true}
    compaction-offload-before-compact: ${AGENT_COMPACTION_OFFLOAD_BEFORE_COMPACT:true}
    # HikariCP（毫秒）
    db-pool-max-size: ${AGENT_DB_POOL_MAX_SIZE:10}
    db-pool-min-idle: ${AGENT_DB_POOL_MIN_IDLE:2}
    db-pool-connection-timeout-ms: ${AGENT_DB_POOL_CONNECTION_TIMEOUT_MS:30000}
    db-pool-idle-timeout-ms: ${AGENT_DB_POOL_IDLE_TIMEOUT_MS:600000}
    db-pool-max-lifetime-ms: ${AGENT_DB_POOL_MAX_LIFETIME_MS:1800000}

# OTel 链路追踪（默认关闭，设置 OTEL_TRACES_EXPORTER=otlp 启用）
otel:
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
    sampler: ${OTEL_TRACES_SAMPLER:always_on}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      headers: ${OTEL_EXPORTER_OTLP_HEADERS:}
  service:
    name: ${OTEL_SERVICE_NAME:agent-framework}

# Agent Protocol 扩展（agentscope-extensions-agent-protocol）的 SDK 自动配置命名空间。
# 与上方 agent.agent-protocol.* 同一批环境变量双落点：本节供 SDK 自动装配读取
# （agentscope.agent-protocol.enabled=true + 容器内有 HarnessAgent bean 即生效）。
# task-store-path 默认为空走容器本地 FS；我们的 ProtocolTaskRepository bean override
# （AgentProtocolConfig）会让 TaskRecord 落 agent_fs，此键仅作 §7 退化路径兜底。
# hitl/streaming 默认必须为 true：resume（HITL 确认续跑，设计 §5.4）与 /events SSE
# （lead 侧 remoteStreaming 消费）在 SDK 侧默认均为关闭态，关闭即协议端确认链路断裂
# （SDK 2.0.3 行为：resume 抛 "HITL is disabled"、/events 抛 "streaming is disabled"）。
# enabled 与 agent.agent-protocol.enabled 同绑 AGENT_PROTOCOL_ENABLED 必须保持一致：
# 仅覆盖 SDK 键会得到无认证的 /tasks* 端点，AgentProtocolConfig 启动期即拒绝（§6.2）。
agentscope:
  agent-protocol:
    enabled: ${AGENT_PROTOCOL_ENABLED:false}
    task-store-path: ${AGENT_PROTOCOL_TASK_STORE:}
    hitl-enabled: ${AGENT_PROTOCOL_HITL_ENABLED:true}
    streaming-enabled: ${AGENT_PROTOCOL_STREAMING_ENABLED:true}
