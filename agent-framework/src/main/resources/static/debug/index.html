<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Agent Debug Console</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<!-- Markdown 渲染依赖（内联 vendor，避免 CDN 外网依赖）：hljs 主体→9 种语言→marked→DOMPurify -->
<link rel="stylesheet" href="vendor/highlight.min.css">
<script src="vendor/highlight.min.js"></script>
<script src="vendor/lang/java.min.js"></script>
<script src="vendor/lang/python.min.js"></script>
<script src="vendor/lang/javascript.min.js"></script>
<script src="vendor/lang/bash.min.js"></script>
<script src="vendor/lang/json.min.js"></script>
<script src="vendor/lang/yaml.min.js"></script>
<script src="vendor/lang/xml.min.js"></script>
<script src="vendor/lang/sql.min.js"></script>
<script src="vendor/lang/markdown.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script>
  // 主题初始化（localStorage 手动覆盖 > 系统自动），避免闪烁
  (function () {
    var t = 'debug-theme';
    var saved = null;
    try { saved = localStorage.getItem(t); } catch (e) {}
    if (saved === 'dark') {
      document.documentElement.classList.add('dark');
    } else if (saved === 'light') {
      document.documentElement.classList.add('light');
    }
  })();
</script>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-left">
      <h1>Agent Debug Console</h1>
      <span id="agentName" class="agent-name">...</span>
    </div>
    <div class="header-right">
      <span id="statusDot" class="status-dot warn"></span>
      <span id="statusText" class="status-text">connecting...</span>
      <span id="checkpointStatus" class="status-text"></span>
      <button id="themeToggle" class="theme-toggle" title="切换明暗主题">●</button>
    </div>
  </header>
  <div class="main">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="module-content">
      <div class="module-loading">Loading module...</div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="close-btn" onclick="window.App.modal.close()">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
